packages:
  - "services/*"

# pnpm 11's deploy command produces package-scoped production dependency
# closures only when workspace injection is explicit. The runtime image uses
# those closures instead of carrying the build workspace into production.
injectWorkspacePackages: true

overrides:
  postcss: 8.5.23
  # GHSA-2v37-7h3g-55p8: a custom nanoid generator loops indefinitely when the
  # requested size is zero. Transitive via next > postcss > nanoid, which
  # resolves 3.3.16 under the postcss pin above. Patched in 3.3.17.
  nanoid: 3.3.17
  # CVE-2026-13697 plus five related advisories: undici cache, cookie and CRLF
  # issues. Transitive via miniflare and wrangler. Patched in 7.29.0.
  undici: 7.29.0
  sharp: 0.35.0
  # GHSA-v2hh-gcrm-f6hx: fast-uri host confusion via literal backslash
  # authority delimiter. Transitive via ajv (build toolchain). The advisory was
  # re-scoped to include 3.1.4, so the fixed floor is now 3.1.5.
  "fast-uri@>=3.0.0 <=3.1.4": 3.1.5
  # brace-expansion denial of service, three advisories across two major lines.
  # Both are dev/lint toolchain only; neither reaches the deployed app.
  #
  # 5.x line (transitive via minimatch@10 in the eslint/typescript-eslint dev
  # toolchain): the unbounded-intermediate-array advisory extends past 5.0.8, so
  # the fixed floor is 5.0.9.
  "brace-expansion@>=5.0.0 <=5.0.8": 5.0.9
  # 1.x line (minimatch@3, also eslint-only). This was previously left unforced
  # because no 1.x patch existed and cross-forcing to 5.x breaks the call site:
  # 1.x exports a callable default (`module.exports = expand`) while 5.x exports
  # a named `expand`, so minimatch@3's `require('brace-expansion')(...)` would
  # throw. 1.1.18 now exists and fixes both 1.x advisories while staying on the
  # callable-default API, so the incompatibility no longer applies and the line
  # can be patched in place.
  "brace-expansion@<1.1.18": 1.1.18
  # GHSA-67mh-4wv8-2f99: the esbuild development server accepts requests from any
  # origin and returns the response. Reached only through drizzle-kit's legacy
  # @esbuild-kit/core-utils, which pins esbuild 0.18.20; patched in 0.24.3.
  # Scoped to that one parent so the app's own esbuild is untouched.
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
  # GHSA-5p4m-2wfm-xmqj (CVE-2026-59870): quadratic CPU consumption resolving
  # !!omap. Transitive via @eslint/eslintrc across 26 paths, all of them the
  # eslint toolchain, so it never reaches the deployed app. Patched in 4.3.1,
  # which stays on the 4.x line the toolchain resolves.
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1
  # Deliberately absent: image-size (GHSA-w3rx-r6r6-pgpr ICNS, GHSA-5p2g-fcmc-qvqq
  # JXL/HEIF -- infinite loops on malformed headers). Both advisories name >=2.0.3
  # as patched and no 2.0.3 exists on the registry; 2.0.2 is the newest published
  # 2.x, so there is nothing to force yet. The single path is `vinext > image-size`,
  # a build-time tool with no production resolution, and it parses only images
  # committed to this repository -- there is no route by which a customer supplies
  # one. Recheck when 2.0.3 publishes; do not cross-force to a 1.x line, which has
  # a different API. Until then `pnpm audit` reports 2 high advisories and that is
  # the accepted state, not an oversight.

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-sts@3.1087.0'
  - '@aws-sdk/core@3.975.2'
  - '@aws-sdk/credential-provider-env@3.972.58'
  - '@aws-sdk/credential-provider-http@3.972.60'
  - '@aws-sdk/credential-provider-ini@3.973.2'
  - '@aws-sdk/credential-provider-login@3.972.64'
  - '@aws-sdk/credential-provider-node@3.972.68'
  - '@aws-sdk/credential-provider-process@3.972.58'
  - '@aws-sdk/credential-provider-sso@3.973.2'
  - '@aws-sdk/credential-provider-web-identity@3.972.64'
  - '@aws-sdk/nested-clients@3.997.32'
  - '@aws-sdk/signature-v4-multi-region@3.996.40'
  - '@aws-sdk/token-providers@3.1087.0'
  - '@aws-sdk/types@3.974.1'
  - '@aws-sdk/xml-builder@3.972.35'
  - '@aws-sdk/checksums@3.1000.17'
  - '@aws-sdk/client-cloudtrail@3.1087.0'
  - '@aws-sdk/client-cloudwatch@3.1087.0'
  - '@aws-sdk/client-ec2@3.1087.0'
  - '@aws-sdk/client-guardduty@3.1087.0'
  - '@aws-sdk/client-iam@3.1087.0'
  - '@aws-sdk/client-rds@3.1087.0'
  - '@aws-sdk/client-s3@3.1087.0'
  - '@aws-sdk/client-securityhub@3.1087.0'
  - '@aws-sdk/middleware-sdk-ec2@3.972.46'
