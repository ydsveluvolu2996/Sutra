AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Customer-side, metadata-only cross-account role for the MSP CMDB and security
  posture service. It grants no object/database payload reads and no resource
  mutations; optional metadata APIs can still return customer-supplied strings.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: MSP trust configuration
        Parameters:
          - VendorCollectorRoleArn
          - ExternalId
          - SessionNamePrefix
          - CustomerTenantId
      - Label:
          default: Customer controls
        Parameters:
          - RoleName
          - PermissionsBoundaryArn
          - EnableLambdaConfiguration
          - EnableCloudFrontConfiguration
          - EnableNativeSecurityFindings
          - EnableSsmInventory
          - EnableOrganizationDiscovery
    ParameterLabels:
      VendorCollectorRoleArn:
        default: Exact vendor collector IAM role ARN
      ExternalId:
        default: Vendor-generated tenant External ID

Parameters:
  VendorCollectorRoleArn:
    Type: String
    Description: >-
      Exact ARN of the vendor workload role that calls sts:AssumeRole. Do not use
      an account-root principal.
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'
    ConstraintDescription: Must be a complete IAM role ARN in the same AWS partition.

  ExternalId:
    Type: String
    Description: >-
      Unique value generated by the MSP platform for this tenant. AWS does not
      treat External IDs as secrets, but this parameter is masked to reduce
      accidental disclosure.
    NoEcho: true
    MinLength: 20
    MaxLength: 128
    AllowedPattern: '^[A-Za-z0-9+=,.@:/_-]+$'

  SessionNamePrefix:
    Type: String
    Default: sutra-
    Description: Required prefix for the cross-account STS role session name.
    MinLength: 3
    MaxLength: 32
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]+$'

  CustomerTenantId:
    Type: String
    Description: Non-secret immutable tenant identifier used only as an IAM role tag.
    MinLength: 3
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9._:-]+$'

  RoleName:
    Type: String
    Default: SutraCollectorRole
    Description: >-
      IAM role name. Changing it changes the ARN registered with the MSP.
      Renamed from SutraReadOnlyRole on 2026-07-28, because that name would be
      misleading once agentless snapshot scanning is enabled. Existing stacks may
      keep the old name — it stays valid; do NOT rename an already-deployed role,
      as CloudFormation would replace it, change its ARN and break the connection.
    MinLength: 1
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]+$'

  PermissionsBoundaryArn:
    Type: String
    Default: ''
    Description: Optional customer-managed IAM permissions boundary ARN.
    AllowedPattern: '^$|^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+$'

  EnableNativeSecurityFindings:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      Permit read-only ingestion from GuardDuty, Security Hub CSPM, Inspector, and
      IAM Access Analyzer when those services are already enabled. This stack never
      enables them.

  EnableLambdaConfiguration:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      Permit Lambda inventory APIs. ListFunctions can return environment-variable
      values, so this module is opt-in and the MSP collector must redact them before
      persistence.

  EnableCloudFrontConfiguration:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      Permit CloudFront distribution inventory. ListDistributions can return origin
      custom-header values, so this module is opt-in and the collector must redact
      those values before persistence.

  EnableSsmInventory:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      Permit read-only AWS Systems Manager Inventory and compliance metadata. This
      can expose installed-package names and versions, so it is opt-in.

  EnableOrganizationDiscovery:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      Permit AWS Organizations account and OU discovery. Effective only in a
      management account or appropriately delegated administrator account.

Conditions:
  HasPermissionsBoundary:
    Fn::Not:
      - Fn::Equals:
          - Ref: PermissionsBoundaryArn
          - ''
  SecurityFindingsEnabled:
    Fn::Equals:
      - Ref: EnableNativeSecurityFindings
      - 'true'
  LambdaConfigurationEnabled:
    Fn::Equals:
      - Ref: EnableLambdaConfiguration
      - 'true'
  CloudFrontConfigurationEnabled:
    Fn::Equals:
      - Ref: EnableCloudFrontConfiguration
      - 'true'
  SsmInventoryEnabled:
    Fn::Equals:
      - Ref: EnableSsmInventory
      - 'true'
  OrganizationDiscoveryEnabled:
    Fn::Equals:
      - Ref: EnableOrganizationDiscovery
      - 'true'

Resources:
  CustomerReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: RoleName
      Path: /sutra/
      Description: Metadata-only role assumed by the MSP CMDB collector.
      MaxSessionDuration: 3600
      PermissionsBoundary:
        Fn::If:
          - HasPermissionsBoundary
          - Ref: PermissionsBoundaryArn
          - Ref: AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: VendorCollectorWithTenantExternalId
            Effect: Allow
            Principal:
              AWS:
                Ref: VendorCollectorRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
              StringLike:
                sts:RoleSessionName:
                  Fn::Sub: '${SessionNamePrefix}*'
      Tags:
        - Key: sutra:tenant-id
          Value:
            Ref: CustomerTenantId
        - Key: sutra:access-mode
          Value: read-only
        - Key: sutra:managed-by
          Value: cloudformation

  ComputeAndNetworkInventoryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read-only compute, network, database, and container metadata.
      Roles:
        - Ref: CustomerReadRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CallerAndRegionalDiscovery
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - ec2:DescribeRegions
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeAccountAttributes
            Resource: '*'

          - Sid: Ec2NetworkAndAssetMetadata
            Effect: Allow
            Action:
              - ec2:DescribeAddresses
              - ec2:DescribeCustomerGateways
              - ec2:DescribeDhcpOptions
              - ec2:DescribeEgressOnlyInternetGateways
              - ec2:DescribeFlowLogs
              - ec2:DescribeImages
              - ec2:DescribeInstanceStatus
              - ec2:DescribeInstances
              - ec2:DescribeInternetGateways
              - ec2:DescribeIpamPools
              - ec2:DescribeIpams
              - ec2:DescribeKeyPairs
              - ec2:DescribeLaunchTemplates
              - ec2:DescribeManagedPrefixLists
              - ec2:DescribeNatGateways
              - ec2:DescribeNetworkAcls
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribePrefixLists
              - ec2:DescribeRouteTables
              - ec2:DescribeSecurityGroupRules
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSnapshots
              - ec2:DescribeSubnets
              - ec2:DescribeTags
              - ec2:DescribeTransitGatewayAttachments
              - ec2:DescribeTransitGatewayPeeringAttachments
              - ec2:DescribeTransitGatewayRouteTables
              - ec2:DescribeTransitGateways
              - ec2:DescribeVolumes
              - ec2:DescribeVolumeStatus
              - ec2:DescribeVpcEndpointConnections
              - ec2:DescribeVpcEndpoints
              - ec2:DescribeVpcEndpointServiceConfigurations
              - ec2:DescribeVpcPeeringConnections
              - ec2:DescribeVpcs
              - ec2:DescribeVpnConnections
              - ec2:DescribeVpnGateways
              - ec2:GetEbsEncryptionByDefault
              - ec2:GetInstanceMetadataDefaults
              - ec2:GetManagedPrefixListEntries
              - ec2:GetSnapshotBlockPublicAccessState
            Resource: '*'

          - Sid: LoadBalancerAndScalingMetadata
            Effect: Allow
            Action:
              - autoscaling:DescribeAutoScalingGroups
              - autoscaling:DescribeLifecycleHooks
              - autoscaling:DescribePolicies
              - autoscaling:DescribeScheduledActions
              - autoscaling:DescribeTags
              - elasticloadbalancing:DescribeAccountLimits
              - elasticloadbalancing:DescribeInstanceHealth
              - elasticloadbalancing:DescribeListenerCertificates
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeLoadBalancerAttributes
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeRules
              - elasticloadbalancing:DescribeSSLPolicies
              - elasticloadbalancing:DescribeTags
              - elasticloadbalancing:DescribeTargetGroupAttributes
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetHealth
            Resource: '*'

          - Sid: DatabaseAndStorageServiceMetadata
            Effect: Allow
            Action:
              - dynamodb:DescribeContinuousBackups
              - dynamodb:DescribeTable
              - dynamodb:DescribeTimeToLive
              - dynamodb:ListTables
              - dynamodb:ListTagsOfResource
              - efs:DescribeAccessPoints
              - efs:DescribeBackupPolicy
              - efs:DescribeFileSystemPolicy
              - efs:DescribeFileSystems
              - efs:DescribeLifecycleConfiguration
              - efs:DescribeMountTargets
              - elasticache:DescribeCacheClusters
              - elasticache:DescribeCacheSubnetGroups
              - elasticache:DescribeReplicationGroups
              - elasticache:DescribeReservedCacheNodes
              - elasticache:ListTagsForResource
              - rds:DescribeCertificates
              - rds:DescribeDBClusterEndpoints
              - rds:DescribeDBClusters
              - rds:DescribeDBClusterSnapshots
              - rds:DescribeDBInstances
              - rds:DescribeDBProxies
              - rds:DescribeDBProxyEndpoints
              - rds:DescribeDBSnapshots
              - rds:DescribeEventSubscriptions
              - rds:ListTagsForResource
            Resource: '*'

          - Sid: ContainerRegistryAndOrchestratorMetadata
            Effect: Allow
            Action:
              - ecr:DescribeImages
              - ecr:DescribeImageScanFindings
              - ecr:DescribeRepositories
              - ecr:GetRegistryPolicy
              - ecr:GetRegistryScanningConfiguration
              - ecr:GetRepositoryPolicy
              - ecr:ListImages
              - ecr:ListTagsForResource
              - ecs:DescribeClusters
              - ecs:DescribeContainerInstances
              - ecs:DescribeServices
              - ecs:ListClusters
              - ecs:ListContainerInstances
              - ecs:ListServices
              - ecs:ListTagsForResource
              - ecs:ListTaskDefinitions
              - ecs:ListTasks
              - eks:DescribeAccessEntry
              - eks:DescribeAddon
              - eks:DescribeCluster
              - eks:DescribeFargateProfile
              - eks:DescribeIdentityProviderConfig
              - eks:DescribeNodegroup
              - eks:DescribePodIdentityAssociation
              - eks:ListAccessEntries
              - eks:ListAddons
              - eks:ListAssociatedAccessPolicies
              - eks:ListClusters
              - eks:ListFargateProfiles
              - eks:ListIdentityProviderConfigs
              - eks:ListNodegroups
              - eks:ListPodIdentityAssociations
              - eks:ListTagsForResource
            Resource: '*'

  GovernanceAndPlatformInventoryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read-only identity, storage configuration, tags, and governance metadata.
      Roles:
        - Ref: CustomerReadRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ResourceTags
            Effect: Allow
            Action:
              - tag:GetComplianceSummary
              - tag:GetResources
              - tag:GetTagKeys
              - tag:GetTagValues
            Resource: '*'

          - Sid: IdentityConfiguration
            Effect: Allow
            Action:
              - iam:GenerateCredentialReport
              - iam:GenerateServiceLastAccessedDetails
              - iam:Get*
              - iam:List*
            Resource: '*'

          - Sid: BucketConfigurationWithoutObjects
            Effect: Allow
            Action:
              - s3:GetAccountPublicAccessBlock
              - s3:GetBucketAcl
              - s3:GetBucketCORS
              - s3:GetBucketEncryption
              - s3:GetBucketLifecycleConfiguration
              - s3:GetBucketLocation
              - s3:GetBucketLogging
              - s3:GetBucketNotification
              - s3:GetBucketObjectLockConfiguration
              - s3:GetBucketOwnershipControls
              - s3:GetBucketPolicy
              - s3:GetBucketPolicyStatus
              - s3:GetBucketPublicAccessBlock
              - s3:GetBucketReplication
              - s3:GetBucketRequestPayment
              - s3:GetBucketTagging
              - s3:GetBucketVersioning
              - s3:GetBucketWebsite
              - s3:ListAllMyBuckets
              - s3:ListAccessPoints
            Resource: '*'

          - Sid: EncryptionAndSecretMetadataWithoutPlaintext
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListKeys
              - kms:ListResourceTags
              - secretsmanager:DescribeSecret
              - secretsmanager:GetResourcePolicy
              - secretsmanager:ListSecrets
              - secretsmanager:ListSecretVersionIds
            Resource: '*'

          - Sid: InfrastructureAndServerlessMetadata
            Effect: Allow
            Action:
              - cloudformation:DescribeStackResources
              - cloudformation:ListStackResources
              - cloudformation:ListStacks
            Resource: '*'

          - Sid: LoggingBackupAndMonitoringPosture
            Effect: Allow
            Action:
              - backup:GetBackupVaultAccessPolicy
              - backup:ListBackupPlans
              - backup:ListBackupVaults
              - backup:ListRecoveryPointsByBackupVault
              - cloudtrail:DescribeTrails
              - cloudtrail:GetEventSelectors
              - cloudtrail:GetInsightSelectors
              - cloudtrail:GetTrailStatus
              - cloudtrail:ListChannels
              - cloudtrail:ListEventDataStores
              - cloudtrail:ListTrails
              - cloudwatch:DescribeAlarms
              - cloudwatch:ListMetrics
              - config:DescribeConfigRules
              - config:DescribeConfigurationRecorderStatus
              - config:DescribeConfigurationRecorders
              - config:DescribeConformancePacks
              - config:DescribeDeliveryChannelStatus
              - config:DescribeDeliveryChannels
              - config:DescribeRemediationConfigurations
              - config:DescribeRetentionConfigurations
              - logs:DescribeLogGroups
              - logs:DescribeResourcePolicies
              - logs:ListTagsForResource
            Resource: '*'

          - Sid: DnsAndCertificateMetadata
            Effect: Allow
            Action:
              - acm:DescribeCertificate
              - acm:ListCertificates
              - acm:ListTagsForCertificate
              - route53:GetDNSSEC
              - route53:GetHostedZone
              - route53:ListHostedZones
              - route53:ListHostedZonesByName
              - route53:ListResourceRecordSets
              - route53:ListTagsForResource
              - route53:ListTagsForResources
            Resource: '*'

  CloudFrontConfigurationPolicy:
    Condition: CloudFrontConfigurationEnabled
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Optional CloudFront inventory; origin custom headers require redaction.
      Roles:
        - Ref: CustomerReadRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontConfigurationReadOnly
            Effect: Allow
            Action:
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:ListDistributions
              - cloudfront:ListTagsForResource
            Resource: '*'

  LambdaConfigurationPolicy:
    Condition: LambdaConfigurationEnabled
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Optional Lambda configuration inventory; response fields require redaction.
      Roles:
        - Ref: CustomerReadRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaConfigurationReadOnly
            Effect: Allow
            Action:
              - lambda:GetFunctionConcurrency
              - lambda:GetFunctionEventInvokeConfig
              - lambda:GetPolicy
              - lambda:GetRuntimeManagementConfig
              - lambda:ListAliases
              - lambda:ListEventSourceMappings
              - lambda:ListFunctions
              - lambda:ListFunctionUrlConfigs
              - lambda:ListTags
              - lambda:ListVersionsByFunction
            Resource: '*'

  NativeSecurityFindingsPolicy:
    Condition: SecurityFindingsEnabled
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read findings and status only from already-enabled AWS security services.
      Roles:
        - Ref: CustomerReadRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: GuardDutyReadOnly
            Effect: Allow
            Action:
              - guardduty:DescribeOrganizationConfiguration
              - guardduty:DescribePublishingDestination
              - guardduty:GetDetector
              - guardduty:GetFindings
              - guardduty:GetFindingsStatistics
              - guardduty:GetMemberDetectors
              - guardduty:ListDetectors
              - guardduty:ListFilters
              - guardduty:ListFindings
              - guardduty:ListMembers
              - guardduty:ListOrganizationAdminAccounts
              - guardduty:ListPublishingDestinations
            Resource: '*'

          - Sid: SecurityHubReadOnly
            Effect: Allow
            Action:
              - securityhub:DescribeHub
              - securityhub:DescribeOrganizationConfiguration
              - securityhub:DescribeStandards
              - securityhub:DescribeStandardsControls
              - securityhub:GetAdministratorAccount
              - securityhub:GetEnabledStandards
              - securityhub:GetFindingAggregator
              - securityhub:GetFindings
              - securityhub:ListEnabledProductsForImport
              - securityhub:ListMembers
              - securityhub:ListOrganizationAdminAccounts
            Resource: '*'

          - Sid: InspectorReadOnly
            Effect: Allow
            Action:
              - inspector2:BatchGetAccountStatus
              - inspector2:DescribeOrganizationConfiguration
              - inspector2:GetDelegatedAdminAccount
              - inspector2:GetEc2DeepInspectionConfiguration
              - inspector2:GetEcrConfiguration
              - inspector2:GetLambdaCodeScanConfiguration
              - inspector2:ListAccountPermissions
              - inspector2:ListCoverage
              - inspector2:ListCoverageStatistics
              - inspector2:ListDelegatedAdminAccounts
              - inspector2:ListFindings
              - inspector2:ListMembers
            Resource: '*'

          - Sid: IamAccessAnalyzerReadOnly
            Effect: Allow
            Action:
              - access-analyzer:GetAnalyzedResource
              - access-analyzer:GetAnalyzer
              - access-analyzer:GetArchiveRule
              - access-analyzer:GetFindingV2
              - access-analyzer:ListAnalyzedResources
              - access-analyzer:ListAnalyzers
              - access-analyzer:ListArchiveRules
              - access-analyzer:ListFindingsV2
            Resource: '*'

  SsmInventoryPolicy:
    Condition: SsmInventoryEnabled
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Optional read-only Systems Manager inventory and compliance metadata.
      Roles:
        - Ref: CustomerReadRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SystemsManagerInventoryReadOnly
            Effect: Allow
            Action:
              - ssm:DescribeInstanceInformation
              - ssm:DescribeInstancePatchStates
              - ssm:GetInventory
              - ssm:GetInventorySchema
              - ssm:ListComplianceItems
              - ssm:ListComplianceSummaries
              - ssm:ListInventoryEntries
              - ssm:ListResourceComplianceSummaries
            Resource: '*'

  OrganizationDiscoveryPolicy:
    Condition: OrganizationDiscoveryEnabled
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Optional read-only AWS Organizations account and OU discovery.
      Roles:
        - Ref: CustomerReadRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OrganizationReadOnly
            Effect: Allow
            Action:
              - organizations:DescribeAccount
              - organizations:DescribeOrganization
              - organizations:DescribeOrganizationalUnit
              - organizations:DescribePolicy
              - organizations:ListAccounts
              - organizations:ListAccountsForParent
              - organizations:ListChildren
              - organizations:ListOrganizationalUnitsForParent
              - organizations:ListParents
              - organizations:ListPolicies
              - organizations:ListPoliciesForTarget
              - organizations:ListRoots
              - organizations:ListTagsForResource
            Resource: '*'

Outputs:
  CustomerReadRoleArn:
    Description: Register this ARN against the matching tenant connection in the MSP platform.
    Value:
      Fn::GetAtt:
        - CustomerReadRole
        - Arn
  AccessMode:
    Description: This template grants metadata and finding reads only.
    Value: READ_ONLY
  TemplateVersion:
    Value: standard-2026-07.3
