AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Least-privilege, read-only customer role for the Sutra collector. It grants
  exactly the metadata, network-exposure, IAM posture, and AWS-native finding
  APIs the collector invokes, and never grants data-plane payload reads,
  mutations, or security-service enablement.

Parameters:
  VendorCollectorRoleArn:
    Type: String
    Description: Exact Sutra source collector IAM role ARN; account root and wildcards are forbidden.
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'
    ConstraintDescription: Must be an exact IAM role ARN in the same AWS partition.

  ExternalId:
    Type: String
    Description: >-
      Unique high-entropy trust binding generated by Sutra for this connection.
      AWS External IDs are not secrets; this template never outputs it and Sutra
      never logs it.
    MinLength: 20
    MaxLength: 128
    AllowedPattern: '^[A-Za-z0-9+=,.@:/_-]+$'

  SessionNamePrefix:
    Type: String
    Default: sutra-
    MinLength: 3
    MaxLength: 32
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]+$'

  CustomerTenantId:
    Type: String
    Description: Non-secret immutable Sutra tenant identifier used as an IAM tag.
    MinLength: 3
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9._:-]+$'

  RoleName:
    Type: String
    Default: SutraCollectorRole
    AllowedValues:
      - SutraCollectorRole
      - SutraReadOnlyRole
    Description: >-
      Reviewed role name used by Sutra contract attestation. Both values are
      accepted permanently: SutraCollectorRole for new stacks, and the pre-rename
      SutraReadOnlyRole so customers who onboarded before 2026-07-28 are never
      forced to replace their role and change its ARN.

  PermissionsBoundaryArn:
    Type: String
    Default: ''
    Description: Optional customer-managed permissions boundary.
    AllowedPattern: '^$|^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+$'

Conditions:
  HasPermissionsBoundary:
    Fn::Not:
      - Fn::Equals:
          - Ref: PermissionsBoundaryArn
          - ''

Resources:
  CustomerReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: RoleName
      Path: /sutra/
      Description: Read-only metadata and posture role for the Sutra collector.
      MaxSessionDuration: 3600
      PermissionsBoundary:
        Fn::If:
          - HasPermissionsBoundary
          - Ref: PermissionsBoundaryArn
          - Ref: AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ExactCollectorWithConnectionExternalId
            Effect: Allow
            Principal:
              AWS:
                Ref: VendorCollectorRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
              StringLike:
                sts:RoleSessionName:
                  Fn::Sub: '${SessionNamePrefix}*'
      Policies:
        - PolicyName: SutraImplementedMetadataCollectors
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyUnimplementedActions
                Effect: Deny
                NotAction:
                  - sts:GetCallerIdentity
                  - ec2:DescribeRegions
                  - ec2:DescribeInstances
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVolumes
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeRouteTables
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeAddresses
                  - ec2:DescribeSnapshots
                  - ec2:DescribeFlowLogs
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - kms:ListKeys
                  - kms:ListAliases
                  - kms:DescribeKey
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - ecr:DescribeRepositories
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - s3:ListAllMyBuckets
                  - s3:GetBucketPublicAccessBlock
                  - rds:DescribeDBInstances
                  - iam:GetAccountSummary
                  - iam:GetAccountPasswordPolicy
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:LookupEvents
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - guardduty:ListFindings
                  - guardduty:GetFindings
                  - securityhub:DescribeHub
                  - securityhub:GetFindings
                  - inspector2:BatchGetAccountStatus
                  - inspector2:ListFindings
                  - bedrock:ListGuardrails
                  - bedrock:GetGuardrail
                  - bedrock:GetModelInvocationLoggingConfiguration
                  - bedrock:GetAccountDataRetention
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - ssm:DescribeInstanceInformation
                  - ssm:DescribeInstancePatchStates
                  - ssm:DescribeInstancePatches
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetRolePolicy
                Resource: '*'
              - Sid: ImplementedMetadataApis
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - ec2:DescribeRegions
                  - ec2:DescribeInstances
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVolumes
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeRouteTables
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeAddresses
                  - ec2:DescribeSnapshots
                  - ec2:DescribeFlowLogs
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - kms:ListKeys
                  - kms:ListAliases
                  - kms:DescribeKey
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - ecr:DescribeRepositories
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - s3:ListAllMyBuckets
                  - s3:GetBucketPublicAccessBlock
                  - rds:DescribeDBInstances
                  - iam:GetAccountSummary
                  - iam:GetAccountPasswordPolicy
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:LookupEvents
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - guardduty:ListFindings
                  - guardduty:GetFindings
                  - securityhub:DescribeHub
                  - securityhub:GetFindings
                  - inspector2:BatchGetAccountStatus
                  - inspector2:ListFindings
                  - bedrock:ListGuardrails
                  - bedrock:GetGuardrail
                  - bedrock:GetModelInvocationLoggingConfiguration
                  - bedrock:GetAccountDataRetention
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - ssm:DescribeInstanceInformation
                  - ssm:DescribeInstancePatchStates
                  - ssm:DescribeInstancePatches
                Resource: '*'
              - Sid: TrustContractAttestation
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetRolePolicy
                Resource:
                  Fn::Sub: 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sutra/${RoleName}'
      Tags:
        - Key: sutra:tenant-id
          Value:
            Ref: CustomerTenantId
        - Key: sutra:access-mode
          Value: read-only
        - Key: sutra:permission-pack
          Value: standard-2026-07.4
        - Key: sutra:managed-by
          Value: cloudformation

Outputs:
  CustomerReadRoleArn:
    Description: Register this exact ARN in the matching Sutra connection.
    Value:
      Fn::GetAtt:
        - CustomerReadRole
        - Arn

  PermissionPackVersion:
    Description: Immutable permission contract attested by this Sutra release.
    Value: standard-2026-07.4
