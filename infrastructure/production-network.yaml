  FirewallAlertLogGroupName:
    Value: !Ref FirewallAlertLogGroup
  FirewallFlowLogGroupName:
    Value: !Ref FirewallFlowLogGroup
  EndpointSecurityGroupId:
    Description: Supply as production-ha.yaml EndpointSecurityGroupId.
