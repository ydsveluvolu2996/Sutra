AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Sutra managed-production network prerequisite: a dedicated two-AZ VPC with
  public ALB, private application, dedicated inspection/NAT-egress, and
  isolated database subnets; one NAT gateway and Network Firewall endpoint per
  AZ; private AWS service endpoints; and fail-closed customer managed ingress
  and HTTPS egress controls.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: VPC and availability zones }
        Parameters: [VpcCidr, AvailabilityZoneA, AvailabilityZoneB, S3GatewayPrefixListId]
      - Label: { default: Subnet address plan }
        Parameters:
          - PublicSubnetCidrA
          - PublicSubnetCidrB
          - PublicNatEgressSubnetCidrA
          - PublicNatEgressSubnetCidrB
          - FirewallSubnetCidrA
          - FirewallSubnetCidrB
          - PrivateAppSubnetCidrA
          - PrivateAppSubnetCidrB
          - PrivateDatabaseSubnetCidrA
          - PrivateDatabaseSubnetCidrB
      - Label: { default: Network audit logging }
        Parameters: [KmsKeyArn, FlowLogRetentionDays, NetworkFirewallLifecyclePhase]
      - Label: { default: Reviewed HTTPS egress CIDRs }
        Parameters:
          - ApprovedHttpsEgressChangeTicket
          - ApprovedHttpsEgressCidr01
          - ApprovedHttpsEgressCidr02
          - ApprovedHttpsEgressCidr03
          - ApprovedHttpsEgressCidr04
          - ApprovedHttpsEgressCidr05
          - ApprovedHttpsEgressCidr06
          - ApprovedHttpsEgressCidr07
          - ApprovedHttpsEgressCidr08
          - ApprovedHttpsEgressCidr09
          - ApprovedHttpsEgressCidr10
          - ApprovedHttpsEgressCidr11
          - ApprovedHttpsEgressCidr12
          - ApprovedHttpsEgressCidr13
          - ApprovedHttpsEgressCidr14
          - ApprovedHttpsEgressCidr15
          - ApprovedHttpsEgressCidr16
          - ApprovedHttpsEgressCidr17
          - ApprovedHttpsEgressCidr18
    ParameterLabels:
      ApprovedHttpsEgressCidr01:
        default: Required reviewed HTTPS destination CIDR
  CloudflareIpv4Snapshot:
    Source: https://www.cloudflare.com/ips-v4
    Retrieved: "2026-07-30"

Parameters:
  VpcCidr:
    Type: String
    Default: 10.64.0.0/16
    AllowedPattern: '^(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})/(?:1[6-9]|2[0-8])$'
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
  S3GatewayPrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]{8,17}$'
  KmsKeyArn:
    Type: String
    AllowedPattern: '^arn:aws(?:-[a-z]+)*:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f-]{36}$'
  FlowLogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 120, 180, 365, 400, 545, 731, 1827, 3653]
  NetworkFirewallLifecyclePhase:
    Type: String
    AllowedValues:
      - rollback-safe-first-create
      - protected-after-live-route-validation
  PublicSubnetCidrA:
    Type: String
    Default: 10.64.0.0/24
    AllowedPattern: '^(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})/(?:1[6-9]|2[0-8])$'
  PublicSubnetCidrB:
    Type: String
    Default: 10.64.1.0/24
    AllowedPattern: '^(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})/(?:1[6-9]|2[0-8])$'
  PublicNatEgressSubnetCidrA:
    Type: String
    Default: 10.64.2.0/28
    AllowedPattern: '^(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})/(?:1[6-9]|2[0-8])$'
  PublicNatEgressSubnetCidrB:
    Type: String
    Default: 10.64.2.16/28
    AllowedPattern: '^(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})/(?:1[6-9]|2[0-8])$'
  FirewallSubnetCidrA:
    Type: String
    Default: 10.64.48.0/28
    AllowedPattern: '^(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})/(?:1[6-9]|2[0-8])$'
  FirewallSubnetCidrB:
    Type: String
    Default: 10.64.48.16/28
    AllowedPattern: '^(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})/(?:1[6-9]|2[0-8])$'
  PrivateAppSubnetCidrA:
    Type: String
    Default: 10.64.16.0/24
    AllowedPattern: '^(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})/(?:1[6-9]|2[0-8])$'
  PrivateAppSubnetCidrB:
    Type: String
    Default: 10.64.17.0/24
    AllowedPattern: '^(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})/(?:1[6-9]|2[0-8])$'
  PrivateDatabaseSubnetCidrA:
    Type: String
    Default: 10.64.32.0/24
    AllowedPattern: '^(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})/(?:1[6-9]|2[0-8])$'
  PrivateDatabaseSubnetCidrB:
    Type: String
    Default: 10.64.33.0/24
    AllowedPattern: '^(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})/(?:1[6-9]|2[0-8])$'
  ApprovedHttpsEgressChangeTicket:
    Type: String
    MinLength: 3
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{2,63}$'
    Description: Immutable review/change identifier recorded on every external prefix-list entry.
  ApprovedHttpsEgressCidr01:
    Type: String
    AllowedPattern: '^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
    Description: >-
      Required provider-published stable IPv4 range or fixed reviewed egress-control
      address. AWS-managed service ranges such as S3 must use their dedicated
      prefix-list parameter instead of consuming an external slot.
  ApprovedHttpsEgressCidr02:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr03:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr04:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr05:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr06:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr07:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr08:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr09:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr10:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr11:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr12:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr13:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr14:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr15:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr16:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr17:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'
  ApprovedHttpsEgressCidr18:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?:\d{1,3}\.){3}\d{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$'

Rules:
  AvailabilityZonesMustDiffer:
    Assertions:
      - Assert: !Not [!Equals [!Ref AvailabilityZoneA, !Ref AvailabilityZoneB]]
        AssertDescription: Production requires two distinct Availability Zones.

Conditions:
  NetworkFirewallProtected: !Equals
    - !Ref NetworkFirewallLifecyclePhase
    - protected-after-live-route-validation
  HasApprovedHttpsEgressCidr02: !Not [!Equals [!Ref ApprovedHttpsEgressCidr02, ""]]
  HasApprovedHttpsEgressCidr03: !Not [!Equals [!Ref ApprovedHttpsEgressCidr03, ""]]
  HasApprovedHttpsEgressCidr04: !Not [!Equals [!Ref ApprovedHttpsEgressCidr04, ""]]
  HasApprovedHttpsEgressCidr05: !Not [!Equals [!Ref ApprovedHttpsEgressCidr05, ""]]
  HasApprovedHttpsEgressCidr06: !Not [!Equals [!Ref ApprovedHttpsEgressCidr06, ""]]
  HasApprovedHttpsEgressCidr07: !Not [!Equals [!Ref ApprovedHttpsEgressCidr07, ""]]
  HasApprovedHttpsEgressCidr08: !Not [!Equals [!Ref ApprovedHttpsEgressCidr08, ""]]
  HasApprovedHttpsEgressCidr09: !Not [!Equals [!Ref ApprovedHttpsEgressCidr09, ""]]
  HasApprovedHttpsEgressCidr10: !Not [!Equals [!Ref ApprovedHttpsEgressCidr10, ""]]
  HasApprovedHttpsEgressCidr11: !Not [!Equals [!Ref ApprovedHttpsEgressCidr11, ""]]
  HasApprovedHttpsEgressCidr12: !Not [!Equals [!Ref ApprovedHttpsEgressCidr12, ""]]
  HasApprovedHttpsEgressCidr13: !Not [!Equals [!Ref ApprovedHttpsEgressCidr13, ""]]
  HasApprovedHttpsEgressCidr14: !Not [!Equals [!Ref ApprovedHttpsEgressCidr14, ""]]
  HasApprovedHttpsEgressCidr15: !Not [!Equals [!Ref ApprovedHttpsEgressCidr15, ""]]
  HasApprovedHttpsEgressCidr16: !Not [!Equals [!Ref ApprovedHttpsEgressCidr16, ""]]
  HasApprovedHttpsEgressCidr17: !Not [!Equals [!Ref ApprovedHttpsEgressCidr17, ""]]
  HasApprovedHttpsEgressCidr18: !Not [!Equals [!Ref ApprovedHttpsEgressCidr18, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - { Key: Name, Value: sutra-production }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:component", Value: network }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: sutra-production }
        - { Key: "sutra:environment", Value: production }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  VpcFlowLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /sutra/production/network/${AWS::StackName}/vpc-flow
      KmsKeyId: !Ref KmsKeyArn
      RetentionInDays: !Ref FlowLogRetentionDays
      Tags:
        - { Key: Name, Value: sutra-production-vpc-flow }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:component", Value: network-audit }

  VpcFlowLogDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-flow-log/*
      Policies:
        - PolicyName: DeliverOnlyToSutraVpcFlowLogGroup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOnlySutraVpcFlowStreams
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !GetAtt VpcFlowLogGroup.Arn
              - Sid: DiscoverPrecreatedLogGroup
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
      Tags:
        - { Key: Name, Value: sutra-production-vpc-flow-delivery }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:component", Value: network-audit }

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      DeliverLogsPermissionArn: !GetAtt VpcFlowLogDeliveryRole.Arn
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref VpcFlowLogGroup
      LogFormat: '${version} ${account-id} ${interface-id} ${srcaddr} ${dstaddr} ${srcport} ${dstport} ${protocol} ${packets} ${bytes} ${start} ${end} ${action} ${log-status} ${vpc-id} ${subnet-id} ${instance-id} ${tcp-flags} ${type} ${pkt-srcaddr} ${pkt-dstaddr} ${region} ${az-id} ${flow-direction} ${traffic-path}'
      MaxAggregationInterval: 60
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      Tags:
        - { Key: Name, Value: sutra-production-all-traffic }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:component", Value: network-audit }

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Ref PublicSubnetCidrA
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: sutra-production-public-a }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:network-tier", Value: public-alb }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Ref PublicSubnetCidrB
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: sutra-production-public-b }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:network-tier", Value: public-alb }

  PrivateAppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Ref PrivateAppSubnetCidrA
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: sutra-production-app-a }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:network-tier", Value: private-app }

  PrivateAppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Ref PrivateAppSubnetCidrB
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: sutra-production-app-b }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:network-tier", Value: private-app }

  PublicNatEgressSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Ref PublicNatEgressSubnetCidrA
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: sutra-production-nat-egress-a }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:network-tier", Value: public-nat-egress }

  PublicNatEgressSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Ref PublicNatEgressSubnetCidrB
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: sutra-production-nat-egress-b }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:network-tier", Value: public-nat-egress }

  FirewallSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Ref FirewallSubnetCidrA
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: sutra-production-firewall-a }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:network-tier", Value: network-firewall }

  FirewallSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Ref FirewallSubnetCidrB
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: sutra-production-firewall-b }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:network-tier", Value: network-firewall }

  PrivateDatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Ref PrivateDatabaseSubnetCidrA
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: sutra-production-database-a }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:network-tier", Value: isolated-database }

  PrivateDatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Ref PrivateDatabaseSubnetCidrB
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: sutra-production-database-b }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:network-tier", Value: isolated-database }

  NatGatewayEipA:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: sutra-production-nat-a }
        - { Key: "sutra:environment", Value: production }

  NatGatewayEipB:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: sutra-production-nat-b }
        - { Key: "sutra:environment", Value: production }

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    DependsOn: InternetGatewayAttachment
    Properties:
      AllocationId: !GetAtt NatGatewayEipA.AllocationId
      ConnectivityType: public
      SubnetId: !Ref PublicNatEgressSubnetA
      Tags:
        - { Key: Name, Value: sutra-production-a }
        - { Key: "sutra:environment", Value: production }

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    DependsOn: InternetGatewayAttachment
    Properties:
      AllocationId: !GetAtt NatGatewayEipB.AllocationId
      ConnectivityType: public
      SubnetId: !Ref PublicNatEgressSubnetB
      Tags:
        - { Key: Name, Value: sutra-production-b }
        - { Key: "sutra:environment", Value: production }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: sutra-production-public }
        - { Key: "sutra:environment", Value: production }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  PrivateAppRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: sutra-production-app-a }
        - { Key: "sutra:environment", Value: production }

  PrivateAppRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: sutra-production-app-b }
        - { Key: "sutra:environment", Value: production }

  PublicNatEgressRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: sutra-production-nat-egress-a }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:network-tier", Value: public-nat-egress }

  PublicNatEgressRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
