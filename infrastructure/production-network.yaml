          - HasApprovedHttpsEgressCidr16
          - Cidr: !Ref ApprovedHttpsEgressCidr16
            Description: !Sub Approved external HTTPS destination 16 via ${ApprovedHttpsEgressChangeTicket}
          - !Ref AWS::NoValue
        - !If
          - HasApprovedHttpsEgressCidr17
          - Cidr: !Ref ApprovedHttpsEgressCidr17
            Description: !Sub Approved external HTTPS destination 17 via ${ApprovedHttpsEgressChangeTicket}
          - !Ref AWS::NoValue
        - !If
          - HasApprovedHttpsEgressCidr18
          - Cidr: !Ref ApprovedHttpsEgressCidr18
            Description: !Sub Approved external HTTPS destination 18 via ${ApprovedHttpsEgressChangeTicket}
          - !Ref AWS::NoValue
      Tags:
        - { Key: Name, Value: sutra-production-approved-https-egress }
        - { Key: "sutra:environment", Value: production }
        - { Key: "sutra:change-ticket", Value: !Ref ApprovedHttpsEgressChangeTicket }

Outputs:
  VpcId:
    Description: Supply as production-ha.yaml VpcId.
    Value: !Ref Vpc
  VpcCidr:
    Description: Supply as production-ha.yaml VpcCidr.
    Value: !Ref VpcCidr
  PublicSubnetIds:
    Description: Supply as production-ha.yaml PublicSubnetIds.
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
  PrivateAppSubnetIds:
    Description: Supply as production-ha.yaml PrivateAppSubnetIds.
    Value: !Join [",", [!Ref PrivateAppSubnetA, !Ref PrivateAppSubnetB]]
  PrivateDatabaseSubnetIds:
    Description: Supply as production-ha.yaml PrivateDatabaseSubnetIds.
    Value: !Join [",", [!Ref PrivateDatabaseSubnetA, !Ref PrivateDatabaseSubnetB]]
  AlbIngressPrefixListId:
