    Value: !Ref ApprovedHttpsEgressPrefixList
  S3GatewayPrefixListId:
    Description: Supply as production-ha.yaml S3GatewayPrefixListId.
    Value: !Ref S3GatewayPrefixListId
  NatGatewayIds:
    Description: Redundant per-AZ NAT gateways downstream of the inspection endpoints.
    Value: !Join [",", [!Ref NatGatewayA, !Ref NatGatewayB]]
  PublicNatEgressSubnetIds:
    Value: !Join [",", [!Ref PublicNatEgressSubnetA, !Ref PublicNatEgressSubnetB]]
  FirewallSubnetIds:
