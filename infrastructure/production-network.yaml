        - { Key: "sutra:component", Value: network-firewall-egress }

  FirewallRouteResolverFunction:
    Type: AWS::Lambda::Function
    DependsOn: FirewallRouteResolverLogGroup
    Properties:
      FunctionName: sutra-production-network-firewall-routes
      Description: Resolves unordered Network Firewall endpoints by exact AZ and owns symmetric routes.
      Handler: index.handler
      MemorySize: 128
      Role: !GetAtt FirewallRouteResolverRole.Arn
      Runtime: python3.13
      Timeout: 900
      Code:
        ZipFile: |
          import json
          import time
          import urllib.request

          import boto3

          ec2 = boto3.client("ec2")
          network_firewall = boto3.client("network-firewall")


          def respond(event, context, status, data=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or "See CloudWatch Logs: " + context.log_stream_name,
                  "PhysicalResourceId": event.get(
                      "PhysicalResourceId",
                      event["StackId"] + "/firewall-routes",
                  ),
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": data or {},
              }).encode("utf-8")
              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=body,
                  method="PUT",
                  headers={
                      "content-type": "",
                      "content-length": str(len(body)),
                  },
              )
              with urllib.request.urlopen(request, timeout=10):
                  pass


          def endpoint_map(properties):
              expected = {
                  properties["AvailabilityZoneA"],
                  properties["AvailabilityZoneB"],
              }
              deadline = time.monotonic() + 720
              while time.monotonic() < deadline:
                  response = network_firewall.describe_firewall(
                      FirewallArn=properties["FirewallArn"],
                  )
                  sync_states = response["FirewallStatus"].get("SyncStates", {})
                  endpoints = {}
                  for availability_zone in expected:
                      attachment = sync_states.get(availability_zone, {}).get(
                          "Attachment",
                          {},
                      )
                      endpoint_id = attachment.get("EndpointId", "")
                      if (
                          attachment.get("Status") == "READY"
                          and endpoint_id.startswith("vpce-")
                      ):
                          endpoints[availability_zone] = endpoint_id
                  if endpoints.keys() == expected:
                      return endpoints
                  time.sleep(10)
              raise RuntimeError(
                  "Network Firewall endpoints were not READY in both exact Availability Zones"
              )


          def route_specs(properties, endpoints):
              return [
                  (
                      properties["PrivateAppRouteTableA"],
                      "0.0.0.0/0",
                      endpoints[properties["AvailabilityZoneA"]],
                  ),
                  (
                      properties["PrivateAppRouteTableB"],
                      "0.0.0.0/0",
                      endpoints[properties["AvailabilityZoneB"]],
                  ),
                  (
                      properties["PublicNatEgressRouteTableA"],
                      properties["PrivateAppSubnetCidrA"],
                      endpoints[properties["AvailabilityZoneA"]],
                  ),
                  (
                      properties["PublicNatEgressRouteTableB"],
                      properties["PrivateAppSubnetCidrB"],
                      endpoints[properties["AvailabilityZoneB"]],
                  ),
              ]


          def current_route(route_table_id, destination):
              response = ec2.describe_route_tables(
                  RouteTableIds=[route_table_id],
              )
              for route in response["RouteTables"][0].get("Routes", []):
                  if route.get("DestinationCidrBlock") == destination:
                      return route
              return None


          def apply_routes(specs):
              for route_table_id, destination, endpoint_id in specs:
                  current = current_route(route_table_id, destination)
                  arguments = {
                      "RouteTableId": route_table_id,
                      "DestinationCidrBlock": destination,
                      "VpcEndpointId": endpoint_id,
                  }
                  if current is None:
                      response = ec2.create_route(**arguments)
                  elif current.get("VpcEndpointId") == endpoint_id:
                      continue
                  else:
                      response = ec2.replace_route(**arguments)
                  if not response.get("Return"):
                      raise RuntimeError(
                          "EC2 did not confirm the symmetric inspection route"
                      )


          def delete_routes(specs):
              for route_table_id, destination, endpoint_id in specs:
                  current = current_route(route_table_id, destination)
                  if current and current.get("VpcEndpointId") == endpoint_id:
                      response = ec2.delete_route(
                          RouteTableId=route_table_id,
                          DestinationCidrBlock=destination,
                      )
                      if not response.get("Return"):
                          raise RuntimeError(
                              "EC2 did not confirm inspection route deletion"
                          )


          def handler(event, context):
              try:
                  properties = event["ResourceProperties"]
                  endpoints = endpoint_map(properties)
                  specs = route_specs(properties, endpoints)
                  if event["RequestType"] == "Delete":
                      delete_routes(specs)
                  else:
                      apply_routes(specs)
                  respond(
                      event,
                      context,
                      "SUCCESS",
                      {
                          "EndpointIdA": endpoints[properties["AvailabilityZoneA"]],
                          "EndpointIdB": endpoints[properties["AvailabilityZoneB"]],
                      },
                  )
              except Exception as error:
                  respond(event, context, "FAILED", reason=str(error)[:1024])

