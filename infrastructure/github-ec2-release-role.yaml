AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Least-privilege GitHub Actions OIDC role for immutable Sutra application
  releases to one existing ECR repository and one exact SSM-managed EC2 host,
  plus the immutable publish-only repository for the notification worker, which
  the SSM release document deliberately cannot deploy.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: Existing account-local token.actions.githubusercontent.com OIDC provider ARN.
    AllowedPattern: ^arn:aws:iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com$
  AppRepositoryName:
    Type: String
    Default: sutra/app
    AllowedPattern: ^[a-z0-9]+(?:[._/-][a-z0-9]+)*$
    Description: Existing immutable ECR repository used only for Sutra application releases.
  NotificationWorkerRepositoryName:
    Type: String
    Default: sutra/notification-worker
    AllowedPattern: ^[a-z0-9]+(?:[._/-][a-z0-9]+)*$
    Description: >-
      Immutable ECR repository for the profile-gated notification delivery
      worker. This template creates it; the worker image is published by
      .github/workflows/notification-worker-release.yml and is never deployed
      through the SSM release document, which stays pinned to sutra/app.
  TargetInstanceId:
    Type: String
    AllowedPattern: ^i-[0-9a-f]{17}$
    Description: Exact SSM-managed Sutra EC2 instance that this role may update.

Rules:
  DistinctReleaseRepositories:
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - Ref: AppRepositoryName
                - Ref: NotificationWorkerRepositoryName
        AssertDescription: AppRepositoryName and NotificationWorkerRepositoryName must be different.

Resources:
  # Mirrors the reviewed sutra/app release contract exactly: immutable tags,
  # scan on push, AES256, and the lifecycle policy that keeps three sha-
  # releases, expires candidate- after a day and untagged after fourteen.
  # The literal text below must stay equivalent to
  # deploy/ec2/ecr-lifecycle-policy.json, which the release workflow compares
  # the live policy against.
  NotificationWorkerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref NotificationWorkerRepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep three security-validated immutable releases","selection":{"tagStatus":"tagged","tagPrefixList":["sha-"],"countType":"imageCountMoreThan","countNumber":3},"action":{"type":"expire"}},{"rulePriority":2,"description":"Expire unpromoted scan candidates after one day","selection":{"tagStatus":"tagged","tagPrefixList":["candidate-"],"countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}},{"rulePriority":3,"description":"Clean unreferenced build artifacts after fourteen days","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":14},"action":{"type":"expire"}}]}
      Tags:
        - Key: sutra:component
          Value: notification-worker
        - Key: sutra:managed-by
          Value: cloudformation

  # DELIBERATELY NOT WIDENED. The notification worker image is never shipped
  # through this document: SUTRA_NOTIFICATION_WORKER_IMAGE is set once by hand
  # in deploy/ec2/.env.ec2, which release-update.sh preserves verbatim. Keeping
  # ImageRef pinned to a single repository means a compromised release job can
  # still only replace the application container.
  ImmutableReleaseDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: Sutra-DeployImmutableRelease
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      UpdateMethod: NewVersion
      Tags:
        - Key: sutra:component
          Value: ec2-private-beta-release
        - Key: sutra:managed-by
          Value: cloudformation
      Content:
        schemaVersion: "2.2"
        description: Deploy one validated immutable Sutra ECR digest.
        parameters:
          ImageRef:
            type: String
            description: Full account-local sutra/app digest reference.
            interpolationType: ENV_VAR
            allowedPattern: '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/sutra/app@sha256:[a-f0-9]{64}$'
        mainSteps:
          - action: aws:runShellScript
            name: deployImmutableSutraRelease
            precondition:
              StringEquals: [platformType, Linux]
            inputs:
              timeoutSeconds: "1800"
              runCommand:
                - set -eu
                - 'printf "%s\n" "${SSM_ImageRef:-}" | grep -Eq ''^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/sutra/app@sha256:[a-f0-9]{64}$'''
                - 'sudo /usr/local/sbin/sutra-release-update "$SSM_ImageRef"'

  GitHubEc2ReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      Description: >-
        Short-lived GitHub OIDC role scoped to the immutable Sutra repository
        identity and main branch, one ECR repository and one EC2 managed node.
      Tags:
        - Key: sutra:component
          Value: ec2-private-beta-release
        - Key: sutra:managed-by
          Value: cloudformation
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            # The subject is matched against the claim GitHub actually mints,
            # not a rendering of it. Two things were wrong here and both made
            # the role unassumable:
            #
            #   * `sub` never contains numeric ids. GitHub emits
            #     `repo:<owner>/<repo>:...`; the immutable account and
            #     repository identity this template wants to pin is carried in
            #     the separate `repository_owner_id` and `repository_id`
            #     claims, which are asserted below and are exactly as immutable
            #     as intended -- a rename or a re-registered owner name changes
            #     neither.
            #   * A job that declares `environment:` gets
            #     `...:environment:<name>`, never `...:ref:refs/heads/main`.
            #     The release job runs under the `ec2-live-release`
            #     environment, so a ref-form subject cannot match it, and the
            #     manual approval on that environment is a stronger boundary
            #     than the branch anyway.
            #
            # Every sibling role in this repository already uses the
            # environment form; this one was the outlier.
            #
            # Note that the DEPLOYED stack cannot have carried the subject this
            # file previously declared: a release succeeded against it on
            # 2026-08-05, back when the workflow had no `environment:` key and
            # therefore presented the ref form. So this template had already
            # drifted from the live trust policy. Confirm the live policy with
            #   aws iam get-role --role-name <role> --query AssumeRolePolicyDocument
            # before updating the stack, so the update is a known change rather
            # than a second guess.
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:ydsveluvolu2996/Sutra:environment:ec2-live-release
                token.actions.githubusercontent.com:repository_owner_id: "229068958"
                token.actions.githubusercontent.com:repository_id: "1301833628"
      Policies:
        - PolicyName: PushOnlyImmutableSutraApplicationRelease
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ObtainShortLivedEcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              # Two enumerated repositories, never a prefix or wildcard. The
              # worker is publish-only: widening this push boundary does not
              # widen the deployment boundary, because ImmutableReleaseDocument
              # above still rejects any ImageRef that is not sutra/app.
              - Sid: PushAndVerifyOnlySutraReleaseRepositories
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetLifecyclePolicy
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${AppRepositoryName}
                  - !GetAtt NotificationWorkerRepository.Arn
        - PolicyName: DeployOnlyToExactSutraManagedNode
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadExactManagedNodeConnection
                Effect: Allow
                Action: ssm:GetConnectionStatus
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${TargetInstanceId}
              - Sid: SendOnlyImmutableReleaseDocumentToExactHost
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${ImmutableReleaseDocument}
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${TargetInstanceId}
              - Sid: ReadCommandResult
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"

Outputs:
  GitHubEc2ReleaseRoleArn:
    Description: Configure the GitHub repository Actions variable AWS_ROLE_ARN with this value.
    Value: !GetAtt GitHubEc2ReleaseRole.Arn
  AppEcrRepositoryArn:
    Description: Repository boundary enforced by the role.
    Value:
      Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${AppRepositoryName}
  NotificationWorkerEcrRepositoryName:
    Description: >-
      Repository the notification-worker publish workflow pushes to; it pins the
      same name in its WORKER_ECR_REPOSITORY environment value.
    Value: !Ref NotificationWorkerRepository
  NotificationWorkerEcrRepositoryUri:
    Description: >-
      Immutable notification-worker repository URI without a tag or digest. The
      published digest is pasted into SUTRA_NOTIFICATION_WORKER_IMAGE on the
      host; it is never deployed by the SSM release document.
    Value: !GetAtt NotificationWorkerRepository.RepositoryUri
  TargetInstanceId:
    Description: Managed-node boundary enforced by the role.
    Value: !Ref TargetInstanceId
  ImmutableReleaseDocumentName:
    Description: Fixed command document accepted by the release role.
    Value: !Ref ImmutableReleaseDocument
