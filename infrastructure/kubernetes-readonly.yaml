apiVersion: v1
kind: Namespace
metadata:
  name: sutra-system
  labels:
    app.kubernetes.io/name: sutra
    app.kubernetes.io/component: collector-access
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sutra-readonly
  namespace: sutra-system
  labels:
    app.kubernetes.io/name: sutra
    app.kubernetes.io/component: collector-access
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sutra-readonly
  labels:
    app.kubernetes.io/name: sutra
    app.kubernetes.io/component: collector-access
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - serviceaccounts
      - resourcequotas
      - limitranges
      - persistentvolumes
      - persistentvolumeclaims
    verbs: [get, list]
  - apiGroups: [apps]
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs: [get, list]
  - apiGroups: [batch]
    resources:
      - jobs
      - cronjobs
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources:
      - ingresses
      - ingressclasses
      - networkpolicies
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: [get, list]
  - apiGroups: [policy]
    resources:
      - poddisruptionbudgets
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources:
      - storageclasses
      - csidrivers
    verbs: [get, list]
  # Optional Trivy Operator evidence. ExposedSecretReport access is deliberate:
  # the collector discards `match` and retains only rule/file metadata. This
  # role never permits reading Kubernetes Secret or ConfigMap objects.
  - apiGroups: [aquasecurity.github.io]
    resources:
      - vulnerabilityreports
      - clustervulnerabilityreports
      - configauditreports
      - exposedsecretreports
      - rbacassessmentreports
      - clusterrbacassessmentreports
      - infraassessmentreports
      - clusterinfraassessmentreports
      - clustercompliancereports
      - sbomreports
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sutra-readonly
  labels:
    app.kubernetes.io/name: sutra
    app.kubernetes.io/component: collector-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sutra-readonly
subjects:
  - kind: ServiceAccount
    name: sutra-readonly
    namespace: sutra-system
