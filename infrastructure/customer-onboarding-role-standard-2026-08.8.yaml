AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Immutable standard-2026-08.8 least-privilege customer role for the Sutra
  collector. It preserves every standard-2026-08.7 capability and adds exactly
  the five AWS Health organization-view reads plus Organizations organization
  and delegated-administrator prerequisite proofs for ADV-06. It adds no AWS
  Health mutation, data-plane payload, or unrelated permission.

Metadata:
  SutraPermissionPack:
    Name: standard
    Version: standard-2026-08.8
    FoundationalFinopsAddOn: foundational-cur2-export-v1
    AdvancedFinopsObjectReadAddOn: compute-optimizer-export-read-v1
    AdvancedFinopsLaunchAddOn: compute-optimizer-export-launch-v1
    AdvancedFinopsSources: cost-anomaly-v1,trusted-advisor-standard-v1,organizations-taxonomy-v1,compute-optimizer-export-discovery-v1,extended-support-projection-v1,support-cases-radar-v1,health-events-v1

Parameters:
  VendorCollectorRoleArn:
    Type: String
    Description: Exact Sutra source collector IAM role ARN; account root and wildcards are forbidden.
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'
    ConstraintDescription: Must be an exact IAM role ARN in the same AWS partition.

  ExternalId:
    Type: String
    Description: >-
      Unique high-entropy trust binding generated by Sutra for this connection.
      AWS External IDs are not secrets; this template never outputs it and Sutra
      never logs it.
    MinLength: 20
    MaxLength: 128
    AllowedPattern: '^[A-Za-z0-9+=,.@:/_-]+$'

  SessionNamePrefix:
    Type: String
    Default: sutra-
    MinLength: 3
    MaxLength: 32
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]+$'

  CustomerTenantId:
    Type: String
    Description: Non-secret immutable Sutra tenant identifier used as an IAM tag.
    MinLength: 3
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9._:-]+$'

  RoleName:
    Type: String
    Default: SutraCollectorRole
    AllowedValues:
      - SutraCollectorRole
      - SutraReadOnlyRole
    Description: >-
      Reviewed role name used by Sutra contract attestation. Both values are
      accepted permanently: SutraCollectorRole for new stacks, and the pre-rename
      SutraReadOnlyRole so customers who onboarded before 2026-07-28 are never
      forced to replace their role and change its ARN.

  PermissionsBoundaryArn:
    Type: String
    Default: ''
    Description: Optional customer-managed permissions boundary.
    AllowedPattern: '^$|^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+$'

Conditions:
  HasPermissionsBoundary:
    Fn::Not:
      - Fn::Equals:
          - Ref: PermissionsBoundaryArn
          - ''

Resources:
  CustomerReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: RoleName
      Path: /sutra/
      Description: Read-only metadata and posture role for the Sutra collector.
      MaxSessionDuration: 3600
      PermissionsBoundary:
        Fn::If:
          - HasPermissionsBoundary
          - Ref: PermissionsBoundaryArn
          - Ref: AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ExactCollectorWithConnectionExternalId
            Effect: Allow
            Principal:
              AWS:
                Ref: VendorCollectorRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
              StringLike:
                sts:RoleSessionName:
                  Fn::Sub: '${SessionNamePrefix}*'
      Policies:
        - PolicyName: SutraImplementedMetadataCollectors
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyUnimplementedActions
                Effect: Deny
                NotAction:
                  - sts:GetCallerIdentity
                  - ec2:DescribeRegions
                  - ec2:DescribeInstances
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVolumes
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeRouteTables
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeAddresses
                  - ec2:DescribeSnapshots
                  - ec2:DescribeFlowLogs
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - kms:ListKeys
                  - kms:ListAliases
                  - kms:DescribeKey
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - ecr:DescribeRepositories
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - s3:ListAllMyBuckets
                  - s3:GetBucketPublicAccessBlock
                  - rds:DescribeDBInstances
                  - iam:GetAccountSummary
                  - iam:GetAccountPasswordPolicy
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:LookupEvents
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - guardduty:ListFindings
                  - guardduty:GetFindings
                  - securityhub:DescribeHub
                  - securityhub:GetFindings
                  - inspector2:BatchGetAccountStatus
                  - inspector2:ListFindings
                  - bedrock:ListGuardrails
                  - bedrock:GetGuardrail
                  - bedrock:GetModelInvocationLoggingConfiguration
                  - bedrock:GetAccountDataRetention
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - ssm:DescribeInstanceInformation
                  - ssm:DescribeInstancePatchStates
                  - ssm:DescribeInstancePatches
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetRolePolicy
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetObjectAttributes
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - bcm-data-exports:ListExports
                  - bcm-data-exports:GetExport
                  - ce:GetAnomalies
                  - ce:GetAnomalyMonitors
                  - ce:GetAnomalySubscriptions
                  - support:DescribeTrustedAdvisorCheckResult
                  - support:DescribeTrustedAdvisorChecks
                  - support:DescribeCases
                  - support:DescribeCommunications
                  - health:DescribeAffectedAccountsForOrganization
                  - health:DescribeAffectedEntitiesForOrganization
                  - health:DescribeEventDetailsForOrganization
                  - health:DescribeEventsForOrganization
                  - health:DescribeHealthServiceStatusForOrganization
                  - organizations:DescribeOrganization
                  - organizations:ListAccounts
                  - organizations:ListDelegatedAdministrators
                  - compute-optimizer:DescribeRecommendationExportJobs
                  - compute-optimizer:GetEnrollmentStatus
                  - compute-optimizer:GetEnrollmentStatusesForOrganization
                  - compute-optimizer:ExportAutoScalingGroupRecommendations
                  - compute-optimizer:ExportEBSVolumeRecommendations
                  - compute-optimizer:ExportEC2InstanceRecommendations
                  - compute-optimizer:ExportECSServiceRecommendations
                  - compute-optimizer:ExportIdleRecommendations
                  - compute-optimizer:ExportLambdaFunctionRecommendations
                  - compute-optimizer:ExportLicenseRecommendations
                  - compute-optimizer:ExportRDSDatabaseRecommendations
                  - compute-optimizer:GetAutoScalingGroupRecommendations
                  - compute-optimizer:GetEBSVolumeRecommendations
                  - compute-optimizer:GetEC2InstanceRecommendations
                  - compute-optimizer:GetECSServiceRecommendations
                  - compute-optimizer:GetIdleRecommendations
                  - compute-optimizer:GetLambdaFunctionRecommendations
                  - compute-optimizer:GetLicenseRecommendations
                  - compute-optimizer:GetRDSDatabaseRecommendations
                  - autoscaling:DescribeAutoScalingGroups
                  - ecs:ListClusters
                  - ecs:ListServices
                  - lambda:ListFunctions
                  - lambda:ListProvisionedConcurrencyConfigs
                  - rds:DescribeDBClusters
                  - eks:DescribeClusterVersions
                  - rds:DescribeDBMajorEngineVersions
                  - rds:DescribeOrderableDBInstanceOptions
                  - es:ListDomainNames
                  - es:DescribeDomain
                  - es:DescribeDomains
                  - elasticache:DescribeCacheClusters
                  - elasticache:DescribeReplicationGroups
                  - elasticache:DescribeCacheEngineVersions
                  - pricing:GetProducts
                Resource: '*'
              - Sid: ImplementedMetadataApis
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - ec2:DescribeRegions
                  - ec2:DescribeInstances
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVolumes
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeRouteTables
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeAddresses
                  - ec2:DescribeSnapshots
                  - ec2:DescribeFlowLogs
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - kms:ListKeys
                  - kms:ListAliases
                  - kms:DescribeKey
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - ecr:DescribeRepositories
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - s3:ListAllMyBuckets
                  - s3:GetBucketPublicAccessBlock
                  - rds:DescribeDBInstances
                  - iam:GetAccountSummary
                  - iam:GetAccountPasswordPolicy
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:LookupEvents
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - guardduty:ListFindings
                  - guardduty:GetFindings
                  - securityhub:DescribeHub
                  - securityhub:GetFindings
                  - inspector2:BatchGetAccountStatus
                  - inspector2:ListFindings
                  - bedrock:ListGuardrails
                  - bedrock:GetGuardrail
                  - bedrock:GetModelInvocationLoggingConfiguration
                  - bedrock:GetAccountDataRetention
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - ssm:DescribeInstanceInformation
                  - ssm:DescribeInstancePatchStates
                  - ssm:DescribeInstancePatches
                Resource: '*'
              - Sid: TrustContractAttestation
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetRolePolicy
                Resource:
                  Fn::Sub: 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sutra/${RoleName}'
        - PolicyName: SutraFinopsCostAnomalyReadV1
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExactFinopsSourceRead
                Effect: Allow
                Action:
                  - ce:GetAnomalies
                  - ce:GetAnomalyMonitors
                  - ce:GetAnomalySubscriptions
                Resource: '*'
        - PolicyName: SutraFinopsTrustedAdvisorStandardReadV1
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExactFinopsSourceRead
                Effect: Allow
                Action:
                  - support:DescribeTrustedAdvisorCheckResult
                  - support:DescribeTrustedAdvisorChecks
                Resource: '*'
        - PolicyName: SutraFinopsOrganizationsTaxonomyReadV1
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExactFinopsSourceRead
                Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                  - organizations:ListAccounts
                Resource: '*'
        - PolicyName: SutraFinopsComputeOptimizerExportReadV1
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExactFinopsSourceRead
                Effect: Allow
                Action:
                  - compute-optimizer:DescribeRecommendationExportJobs
                  - compute-optimizer:GetEnrollmentStatus
                  - compute-optimizer:GetEnrollmentStatusesForOrganization
                Resource: '*'
        - PolicyName: SutraFinopsExtendedSupportProjectionReadV1
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExactExtendedSupportProjectionRead
                Effect: Allow
                Action:
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - eks:DescribeClusterVersions
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                  - rds:DescribeDBMajorEngineVersions
                  - rds:DescribeOrderableDBInstanceOptions
                  - es:ListDomainNames
                  - es:DescribeDomain
                  - es:DescribeDomains
                  - elasticache:DescribeCacheClusters
                  - elasticache:DescribeReplicationGroups
                  - elasticache:DescribeCacheEngineVersions
                  - pricing:GetProducts
                Resource: '*'
        - PolicyName: SutraFinopsSupportCasesReadV1
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExactSupportCasesRead
                Effect: Allow
                Action:
                  - support:DescribeCases
                  - support:DescribeCommunications
                Resource: '*'
        - PolicyName: SutraFinopsHealthOrganizationReadV1
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExactHealthOrganizationRead
                Effect: Allow
                Action:
                  - health:DescribeAffectedAccountsForOrganization
                  - health:DescribeAffectedEntitiesForOrganization
                  - health:DescribeEventDetailsForOrganization
                  - health:DescribeEventsForOrganization
                  - health:DescribeHealthServiceStatusForOrganization
                  - organizations:DescribeOrganization
                  - organizations:ListDelegatedAdministrators
                Resource: '*'
      Tags:
        - Key: sutra:tenant-id
          Value:
            Ref: CustomerTenantId
        - Key: sutra:access-mode
          Value: read-only
        - Key: sutra:permission-pack
          Value: standard-2026-08.8
        - Key: sutra:managed-by
          Value: cloudformation

Outputs:
  CustomerReadRoleArn:
    Description: Register this exact ARN in the matching Sutra connection.
    Value:
      Fn::GetAtt:
        - CustomerReadRole
        - Arn

  PermissionPackVersion:
    Description: Immutable permission contract attested by this Sutra release.
    Value: standard-2026-08.8

  RequiredFoundationalFinopsAddOn:
    Description: Separately owned resource-scoped policy required for Foundational billing reads.
    Value: foundational-cur2-export-v1

  RequiredComputeOptimizerExportReadAddOn:
    Description: Separately owned regional prefix-scoped policy required for Compute Optimizer export-object reads.
    Value: compute-optimizer-export-read-v1

  RequiredComputeOptimizerExportLaunchAddOn:
    Description: Dedicated regional bucket and exact launch policy required to create Compute Optimizer export jobs.
    Value: compute-optimizer-export-launch-v1
