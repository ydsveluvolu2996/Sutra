# Copy this file to wrangler.toml before deploying. The Worker contains no
# tunnel secret: origin.sutracmdb.com is a proxied CNAME to
# <tunnel-id>.cfargotunnel.com, and the tunnel forwards it to internal HTTP Caddy.
name = "sutra-edge-fallback"
main = "edge-fallback.mjs"
compatibility_date = "2026-07-01"
workers_dev = false

[vars]
PUBLIC_HOSTNAME = "www.sutracmdb.com"
APEX_HOSTNAME = "sutracmdb.com"
ORIGIN_HOSTNAME = "origin.sutracmdb.com"

# Routes are intentionally managed by configure-routes.mjs, not Wrangler.
# Keeping them out of this file prevents a script-only deployment from deleting
# the no-script /assets/* exclusion or reverting request_limit_fail_open.
