# Sutra single-box production-ish stack for a fresh Ubuntu EC2 instance.
#
# Derived from the repository root `compose.yaml` (the local pilot). Differences:
#   * `app` is NOT published to the host; it is reachable only on internal
#     Compose networks. Caddy is a private HTTP origin and Cloudflare Tunnel is
#     the sole external ingress. No container publishes a host port.
#   * `postgres` is not published to the host either (internal network only).
#   * Caddy serves an automatic maintenance page (503) whenever `app` is
#     stopped/down/unhealthy; the Cloudflare edge fallback covers a stopped EC2.
#   * `notification-worker` is profile-gated ("notifications"); enable it only when
#     AWS Secrets Manager + SES are configured, otherwise it flaps to unready.
#     While that profile is inactive NOTHING delivers notifications: the app
#     keeps writing `security_notification_outbox` rows with status='pending'.
#     See docs/notification-delivery-enablement.md before enabling it.
#
# Relative paths resolve from this file's directory (deploy/ec2/) because that is
# the default compose project directory when invoked as
#   docker compose -f deploy/ec2/compose.prod.yaml ...
# Hence the `../../` prefixes that point back at the repository root.
#
# Secrets (SUTRA_POSTGRES_*/SUTRA_JOB_RUNNER_TOKEN) come from ../../.sutra/docker.env,
# operator settings (SUTRA_DOMAIN/SUTRA_CONTACT_*) come from
# ./.env.ec2. See bootstrap.sh / README.md for the exact --env-file ordering.
# The named-tunnel config and credential are ignored files under
# ../../.sutra/cloudflared/; see cloudflared-config.yml.example.

name: sutra-prod

x-default-logging: &default-logging
  # Bound every container's json-file logs so an error loop cannot consume the
  # EC2 root volume. `docker compose logs` continues to work as usual.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: sutra
      POSTGRES_USER: sutra_owner
      POSTGRES_PASSWORD: ${SUTRA_POSTGRES_OWNER_PASSWORD:?Run deploy/ec2/bootstrap.sh to generate the ignored owner secret in .sutra/docker.env}
      SUTRA_POSTGRES_APP_PASSWORD: ${SUTRA_POSTGRES_APP_PASSWORD:?Run deploy/ec2/bootstrap.sh to generate the ignored runtime secret in .sutra/docker.env}
    # No host port: the database is reachable only on the internal compose network.
    volumes:
      - sutra_postgres_data:/var/lib/postgresql
      - ../../docker/postgres-init.sh:/docker-entrypoint-initdb.d/010-sutra-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username sutra_owner --dbname sutra"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    logging: *default-logging
    shm_size: 256m
    pids_limit: 256
    mem_reservation: 768m
    mem_limit: 2g
    cpus: "1.25"
    restart: unless-stopped

  migrate:
    image: ${SUTRA_APP_IMAGE:?Set SUTRA_APP_IMAGE to an immutable OCI digest in deploy/ec2/.env.ec2}
    pull_policy: always
    entrypoint: ["node", "scripts/postgres-migrate.mjs"]
    environment:
      SUTRA_MIGRATOR_DATABASE_URL: postgresql://sutra_owner:${SUTRA_POSTGRES_OWNER_PASSWORD:?Run deploy/ec2/bootstrap.sh to generate the ignored owner secret in .sutra/docker.env}@postgres:5432/sutra
      SUTRA_POSTGRES_RUNTIME_ROLE: sutra_app
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    logging: *default-logging
    pids_limit: 256
    mem_reservation: 256m
    mem_limit: 1g
    cpus: "1.0"
    restart: "no"

  app:
    image: ${SUTRA_APP_IMAGE:?Set SUTRA_APP_IMAGE to an immutable OCI digest in deploy/ec2/.env.ec2}
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://sutra_app:${SUTRA_POSTGRES_APP_PASSWORD:?Run deploy/ec2/bootstrap.sh to generate the ignored runtime secret in .sutra/docker.env}@postgres:5432/sutra
      SUTRA_WEB_HOST: 0.0.0.0
      # Explicit public private-beta identity boundary. Production remains
      # disabled behind its separate managed-hosting release gates.
      SUTRA_DEPLOYMENT_ENV: staging
      SUTRA_PUBLIC_ORIGIN: https://www.${SUTRA_DOMAIN:?Set SUTRA_DOMAIN in deploy/ec2/.env.ec2}
      # The health endpoint exposes this non-secret immutable identity so both
      # the host transaction and the edge release gate prove the served build.
      SUTRA_RELEASE_IMAGE: ${SUTRA_APP_IMAGE:?Set SUTRA_APP_IMAGE to an immutable OCI digest in deploy/ec2/.env.ec2}
      SUTRA_LOCAL_MODE: "false"
      # Defaults to the private-beta password gate. The exact
      # sutra/runtime/zoho secret can switch this to OIDC only after the Zoho
      # organization-admin invitation exists.
      SUTRA_IDENTITY_MODE: ${SUTRA_IDENTITY_MODE:-password}
      SUTRA_PRIVATE_BETA_PASSWORD_ENABLED: "true"
      # Separate exact-string approval for the invitation-only OIDC adapter.
      # The deployment boundary selects only the switch matching identity mode;
      # neither switch can enable the other adapter.
      SUTRA_PRIVATE_BETA_OIDC_ENABLED: "true"
      SUTRA_PASSWORD_MFA_REQUIRED: "true"
      # Turnstile is mandatory for public password login, invitation acceptance
      # and the unauthenticated contact form. The entrypoint persists these into
      # the Worker runtime file; the loopback-only bypass is forbidden here.
      SUTRA_TURNSTILE_ENABLED: "true"
      SUTRA_TURNSTILE_SITE_KEY: ${SUTRA_TURNSTILE_SITE_KEY:?Create a hostname-restricted Cloudflare Turnstile widget}
      SUTRA_TURNSTILE_SECRET_KEY: ${SUTRA_TURNSTILE_SECRET_KEY:?Store the Turnstile secret in the ignored EC2 environment}
      SUTRA_TURNSTILE_DEV_BYPASS: "false"
      # The collector runs inside this container and receives only short-lived
      # EC2 workload credentials. Customer access remains External-ID protected.
      SUTRA_COLLECTOR_MODE: live
      SUTRA_ALLOW_LIVE_AWS: "true"
      SUTRA_COLLECTOR_PRINCIPAL_ARN: ${SUTRA_COLLECTOR_PRINCIPAL_ARN:?Set the exact EC2 instance-role ARN}
      SUTRA_BROKER_URL: http://127.0.0.1:8788
      # Exact FinOps plan references are encrypted before persistence. Compose
      # must reject the release before creating any service when either half of
      # this operator-provisioned pair is absent; setup-local-pilot validates
      # the key material and copies it into the mode-0600 Worker runtime file.
      SUTRA_FINOPS_EVIDENCE_REFERENCE_KEY: ${SUTRA_FINOPS_EVIDENCE_REFERENCE_KEY:?Provision the 256-bit FinOps evidence-reference key in the ignored .sutra/docker.env}
      SUTRA_FINOPS_EVIDENCE_REFERENCE_KEY_VERSION: ${SUTRA_FINOPS_EVIDENCE_REFERENCE_KEY_VERSION:?Provision the FinOps evidence-reference key version in the ignored .sutra/docker.env}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
      # The UI must never claim notification delivery is configured while the
      # worker profile is off, so this is derived from the single operator switch
      # instead of being independently settable. It only labels readiness; the
      # app never delivers, whatever this says.
      SUTRA_NOTIFICATION_WORKER_CONFIGURED: ${SUTRA_NOTIFICATIONS_ENABLED:-false}
      SUTRA_JOB_RUNNER_TOKEN: ${SUTRA_JOB_RUNNER_TOKEN}
      SUTRA_JOB_RUNNER_INTERVAL_MS: ${SUTRA_JOB_RUNNER_INTERVAL_MS:-15000}
      SUTRA_RESOURCE_RETIREMENT_COMPLETE_MISSES: ${SUTRA_RESOURCE_RETIREMENT_COMPLETE_MISSES:-2}
      SUTRA_CONTACT_RECIPIENT: ${SUTRA_CONTACT_RECIPIENT:-}
      SUTRA_CONTACT_FROM: ${SUTRA_CONTACT_FROM:-}
      SUTRA_CONTACT_PROVIDER: ${SUTRA_CONTACT_PROVIDER:-}
      SUTRA_CONTACT_WEBHOOK_URL: ${SUTRA_CONTACT_WEBHOOK_URL:-}
      SUTRA_CONTACT_EMAIL_API_URL: ${SUTRA_CONTACT_EMAIL_API_URL:-}
      SUTRA_CONTACT_EMAIL_API_KEY: ${SUTRA_CONTACT_EMAIL_API_KEY:-}
      SUTRA_INVITATION_FROM: ${SUTRA_INVITATION_FROM:-}
      SUTRA_INVITATION_EMAIL_PROVIDER: ${SUTRA_INVITATION_EMAIL_PROVIDER:-}
      SUTRA_INVITATION_EMAIL_API_URL: ${SUTRA_INVITATION_EMAIL_API_URL:-}
      SUTRA_INVITATION_EMAIL_API_KEY: ${SUTRA_INVITATION_EMAIL_API_KEY:-}
      SUTRA_ZOHO_DATACENTER: ${SUTRA_ZOHO_DATACENTER:-}
      SUTRA_ZOHO_MAIL_ACCOUNT_ID: ${SUTRA_ZOHO_MAIL_ACCOUNT_ID:-}
      SUTRA_ZOHO_CLIENT_ID: ${SUTRA_ZOHO_CLIENT_ID:-}
      SUTRA_ZOHO_CLIENT_SECRET: ${SUTRA_ZOHO_CLIENT_SECRET:-}
      SUTRA_ZOHO_REFRESH_TOKEN: ${SUTRA_ZOHO_REFRESH_TOKEN:-}
      SUTRA_OIDC_PROVIDERS: ${SUTRA_OIDC_PROVIDERS:-}
      SUTRA_OIDC_TRANSACTION_KEY: ${SUTRA_OIDC_TRANSACTION_KEY:-}
      # Production provisioning is invitation-only. Keep this a literal false
      # so a stale host environment value can never enable public organization
      # creation during an identity-provider cutover.
      SUTRA_HOSTED_SELF_SERVE_SIGNUP: "false"
      # Agentless disk scanning. All twelve default to empty: the
      # resolver in lib/aws-agentless-executor-config.ts has NO defaults by design
      # and refuses with the exact list of unset names, so an unconfigured host
      # reports "not configured" rather than snapshotting into a guessed account.
      # Setting them in .sutra/docker.env alone is NOT enough — that file is only
      # an --env-file for YAML interpolation, so a variable that is not named here
      # never reaches the container, and one not listed in AGENTLESS_VARS in
      # scripts/setup-local-pilot.mjs never reaches the Worker runtime that reads it.
      SUTRA_AGENTLESS_SCAN_ACCOUNT_ID: ${SUTRA_AGENTLESS_SCAN_ACCOUNT_ID:-}
      SUTRA_AGENTLESS_SCAN_AZ: ${SUTRA_AGENTLESS_SCAN_AZ:-}
      SUTRA_AGENTLESS_KMS_KEY_ARN: ${SUTRA_AGENTLESS_KMS_KEY_ARN:-}
      SUTRA_AGENTLESS_SCANNER_IMAGE: ${SUTRA_AGENTLESS_SCANNER_IMAGE:-}
      SUTRA_AGENTLESS_LIVE_VALIDATED: ${SUTRA_AGENTLESS_LIVE_VALIDATED:-}
      SUTRA_AGENTLESS_ORCHESTRATOR_ROLE_ARN: ${SUTRA_AGENTLESS_ORCHESTRATOR_ROLE_ARN:-}
      SUTRA_AGENTLESS_AMI_ID: ${SUTRA_AGENTLESS_AMI_ID:-}
      SUTRA_AGENTLESS_INSTANCE_TYPE: ${SUTRA_AGENTLESS_INSTANCE_TYPE:-}
      SUTRA_AGENTLESS_SUBNET_ID: ${SUTRA_AGENTLESS_SUBNET_ID:-}
      SUTRA_AGENTLESS_SECURITY_GROUP_ID: ${SUTRA_AGENTLESS_SECURITY_GROUP_ID:-}
      SUTRA_AGENTLESS_INSTANCE_PROFILE_ARN: ${SUTRA_AGENTLESS_INSTANCE_PROFILE_ARN:-}
      SUTRA_AGENTLESS_FINDINGS_BUCKET: ${SUTRA_AGENTLESS_FINDINGS_BUCKET:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No host port: only Caddy (on the internal network) may reach the app.
    expose:
      - "3000"
    volumes:
      - sutra_runtime_config:/app/runtime
      - sutra_application_data:/app/.sutra
    healthcheck:
      test:
        - CMD
        - node
        - -e
        # Node fetch deliberately normalizes the Host header. The low-level
        # client preserves the canonical public Host required by origin checks.
        - >-
          const{request}=require('node:http');const r=request({hostname:'127.0.0.1',port:3000,path:'/api/healthz',headers:{Host:'www.${SUTRA_DOMAIN:?Set SUTRA_DOMAIN in deploy/ec2/.env.ec2}','X-Forwarded-Proto':'https'}},s=>{s.resume();s.on('end',()=>process.exit(s.statusCode>=200&&s.statusCode<300?0:1))});r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>r.destroy(new Error('timeout')));r.end()
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      application:
      app-egress:
        # Make the internet-capable bridge the deterministic default route;
        # `data` is deliberately internal and must never capture AWS/API egress.
        gw_priority: 1
      data:
    logging: *default-logging
    init: true
    pids_limit: 512
    mem_reservation: 1g
    mem_limit: 3g
    cpus: "1.5"
    restart: unless-stopped

  caddy:
    # Multi-architecture manifest pinned so a redeploy cannot silently acquire
    # a different edge binary.
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    depends_on:
      - app
    environment:
      SUTRA_DOMAIN: ${SUTRA_DOMAIN:?Set SUTRA_DOMAIN in deploy/ec2/.env.ec2 (e.g. sutracmdb.com)}
    # Private origin only; Cloudflare Tunnel reaches this port on the `tunnel`
    # bridge and Docker publishes nothing to the EC2 host/network interface.
    expose:
      - "8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./maintenance:/srv/maintenance:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/caddy-healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - tunnel
      - application
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    # The upstream Caddy binary carries a file capability. Retaining only this
    # capability is required for Linux to execute it under no-new-privileges;
    # the service itself still listens solely on unprivileged port 8080.
    cap_add: ["NET_BIND_SERVICE"]
    pids_limit: 128
    mem_reservation: 64m
    mem_limit: 256m
    cpus: "0.5"
    restart: unless-stopped

  cloudflared:
    # Multi-architecture manifest pinned to the reviewed connector binary. The
    # image entrypoint disables autoupdate;
    # updates are deliberate digest changes followed by a normal redeploy.
    image: cloudflare/cloudflared:latest@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    depends_on:
      caddy:
        condition: service_healthy
    volumes:
      # Long syntax with create_host_path=false fails closed when an operator
      # has not provisioned the ignored named-tunnel files. Docker must never
      # create an empty directory where a credential file was expected.
      - type: bind
        source: ../../.sutra/cloudflared/config.yml
        target: /etc/cloudflared/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../.sutra/cloudflared/credentials.json
        target: /etc/cloudflared/credentials.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      tunnel:
        gw_priority: 1
    logging: *default-logging
    pids_limit: 128
    mem_reservation: 64m
    mem_limit: 256m
    cpus: "0.5"
    stop_grace_period: 30s
    restart: unless-stopped

  notification-worker:
    # Activated either by `--profile notifications` (bootstrap.sh, redeploy.sh,
    # release-update.sh, which grep SUTRA_NOTIFICATIONS_ENABLED) or by
    # COMPOSE_PROFILES=notifications in deploy/ec2/.env.ec2, which is what makes
    # systemd (deploy/ec2/sutra.service) start it across reboots.
    profiles: ["notifications"]
    # The 15 GiB private-beta host must never compile images. Enabling this
    # profile therefore requires a separately published immutable worker image;
    # no release workflow publishes one yet, so the fallback tag below is
    # deliberately unpullable and this service fails closed.
    image: ${SUTRA_NOTIFICATION_WORKER_IMAGE:-sutra-notification-worker:unavailable}
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://sutra_app:${SUTRA_POSTGRES_APP_PASSWORD:?Run deploy/ec2/bootstrap.sh to generate the ignored runtime secret in .sutra/docker.env}@postgres:5432/sutra
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      SUTRA_NOTIFICATION_HEALTH_PORT: "8081"
      SUTRA_NOTIFICATION_POLL_INTERVAL_MS: ${SUTRA_NOTIFICATION_POLL_INTERVAL_MS:-1000}
      SUTRA_NOTIFICATION_SECRET_PREFIX: ${SUTRA_NOTIFICATION_SECRET_PREFIX:-sutra/notifications/}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8081/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      data:
      worker-egress:
        gw_priority: 1
    logging: *default-logging
    pids_limit: 128
    mem_reservation: 128m
    mem_limit: 512m
    cpus: "0.75"
    restart: unless-stopped

volumes:
  sutra_postgres_data:
  sutra_runtime_config:
  sutra_application_data:
  caddy_data:
  caddy_config:

networks:
  # Sole internet ingress: cloudflared makes outbound tunnel connections and
  # reaches Caddy here. No service publishes a host port.
  tunnel:
  # Private Caddy -> app path with no internet gateway.
  application:
    internal: true
  # Postgres is reachable solely by app/migrate/worker on this no-egress bridge.
  data:
    internal: true
  # The app requires outbound AWS/API access but no additional ingress peer.
  app-egress:
  # Notification delivery needs AWS egress but no network path to Caddy/app.
  worker-egress:
