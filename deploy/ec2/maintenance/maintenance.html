<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Sutra — We'll be right back</title>
<style>
  :root {
    --bg: #05070f;
    --ink: #eaf2ff;
    --muted: #93a4c4;
    --cyan: #22d3ee;
    --blue: #3b82f6;
    --violet: #8b5cf6;
    --card: rgba(255, 255, 255, 0.04);
    --hair: rgba(255, 255, 255, 0.10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(1100px 620px at 15% -10%, rgba(34, 211, 238, 0.20), transparent 60%),
      radial-gradient(1000px 640px at 85% 0%, rgba(139, 92, 246, 0.22), transparent 60%),
      radial-gradient(1200px 800px at 50% 120%, rgba(59, 130, 246, 0.18), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--hair);
    border-radius: 20px;
    padding: 44px 40px;
    backdrop-filter: blur(10px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    text-align: center;
  }
  .wordmark {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--cyan), var(--blue) 55%, var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0 0 6px;
  }
  .tagline {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 30px;
  }
  .orb {
    width: 74px;
    height: 74px;
    margin: 0 auto 26px;
    border-radius: 50%;
    background: conic-gradient(from 140deg, var(--cyan), var(--blue), var(--violet), var(--cyan));
    filter: blur(0.2px);
    animation: spin 5.5s linear infinite;
    box-shadow: 0 0 40px rgba(59, 130, 246, 0.45);
    position: relative;
  }
  .orb::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: var(--bg);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 26px;
    line-height: 1.25;
    margin: 0 0 14px;
    font-weight: 700;
  }
  p.lede {
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 28px;
  }
  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  a.btn {
    display: inline-block;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid var(--hair);
    color: var(--ink);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  a.btn.primary {
    background: linear-gradient(90deg, var(--cyan), var(--blue) 55%, var(--violet));
    color: #05070f;
    border-color: transparent;
  }
  a.btn:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.28); }
  .foot {
    margin-top: 30px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="orb" aria-hidden="true"></div>
    <p class="wordmark">Sutra</p>
    <p class="tagline">Cloud Security CMDB</p>
    <h1>We'll be right back</h1>
    <p class="lede">
      Sutra is briefly offline for maintenance or an update. Your data is safe and
      the service will return shortly. Thanks for your patience.
    </p>
    <div class="actions">
      <a class="btn primary" href="mailto:support@sutracmdb.com?subject=Sutra%20availability">Email us</a>
      <a class="btn" href="/" onclick="location.reload();return false;">Try again</a>
    </div>
    <p class="foot">If this persists, reach us at support@sutracmdb.com.</p>
  </main>
</body>
</html>
