# Group configured on the customer's EKS access entry. The chart never creates
# cloud IAM identities, credentials, tokens, workloads, webhooks or agents.
kubernetesGroup: sutra:readers

# Permit Sutra to import reports only when the customer separately installs and
# operates Trivy Operator. Sutra does not install Trivy or claim scanner coverage.
trivyReports:
  enabled: false

agent:
  enabled: false
  image:
    repository: ""
    # Production installs pin an immutable sha256 image digest.
    digest: ""
    pullPolicy: IfNotPresent
  controlPlane:
    url: ""
  cluster:
    id: ""
    name: ""
  enrollment:
    # Pre-create this Secret with only the short-lived bootstrap value. Helm
    # never receives or renders the value.
    existingSecret: ""
    key: bootstrap
  schedule:
    intervalSeconds: 900
  state:
    existingClaim: ""
    storageClassName: ""
    size: 1Gi
    keepOnUninstall: true
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  modules:
    trivy: true
    kyverno: true
    falco: true
    cilium: true
  # Optional bounded Hubble flow-export collection. Mounts the customer's
  # Cilium hubble export file read-only. Coverage is node-local for this
  # single-replica agent and the flow evidence carries explicit sampling and
  # coverage limitations; per-node coverage requires per-node enrollment.
  hubble:
    exportFile:
      enabled: false
      hostPath: /var/run/cilium/hubble/events.log
      # Exact Hubble/Cilium version identifier, for example "1.19.5".
      version: ""
  # Optional in-cluster Falco signing-gateway readiness URL. When set, the
  # agent probes /readyz without credentials and reports a falco-gateway
  # module state in its heartbeat.
  falcoGateway:
    healthUrl: ""
  networkPolicy:
    enabled: true
