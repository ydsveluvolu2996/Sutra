name: Release Kubernetes agent to ECR

on:
  workflow_dispatch:
    inputs:
      releaseReason:
        description: Approved reason for this immutable release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kubernetes-agent-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, scan, attest, and sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: kubernetes-production-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate protected-environment configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          NODE_IMAGE: ${{ vars.NODE_IMAGE }}
        run: |
          set -euo pipefail
          test -n "${AWS_REGION}"
          test -n "${AWS_ROLE_ARN}"
          test -n "${ECR_REPOSITORY}"
          [[ "${NODE_IMAGE}" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "${AWS_ROLE_ARN}" == arn:aws:iam::*:role/* ]]

      - name: Configure short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: sutra-kubernetes-agent-release

      - name: Install Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Authenticate Docker to the approved ECR registry
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "${AWS_REGION}" |
            docker login --username AWS --password-stdin "${registry}"

      - name: Build and push immutable commit image
        id: image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          NODE_IMAGE: ${{ vars.NODE_IMAGE }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          tag="git-${GITHUB_SHA}"
          image="${registry}/${ECR_REPOSITORY}:${tag}"
          docker buildx build \
            --file services/kubernetes-collector/Dockerfile.agent \
            --platform linux/amd64 \
            --build-arg "NODE_IMAGE=${NODE_IMAGE}" \
            --provenance=true \
            --sbom=true \
            --push \
            --tag "${image}" \
            .
          digest="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${tag}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=${registry}/${ECR_REPOSITORY}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate image SBOM
        run: syft "${{ steps.image.outputs.ref }}" --output "spdx-json=sutra-kubernetes-agent.spdx.json"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign image digest and attach SBOM attestation
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_REF}"
          cosign attest --yes \
            --type spdxjson \
            --predicate sutra-kubernetes-agent.spdx.json \
            "${IMAGE_REF}"

      - name: Retain reviewed SBOM
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sutra-kubernetes-agent-${{ github.sha }}-sbom
          path: sutra-kubernetes-agent.spdx.json
          if-no-files-found: error
          retention-days: 90
