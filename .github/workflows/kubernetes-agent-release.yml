name: Release Kubernetes runtime images to ECR

on:
  workflow_dispatch:
    inputs:
      releaseReason:
        description: Approved reason for this immutable release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kubernetes-runtime-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, scan, attest, and sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: kubernetes-production-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate protected-environment configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AGENT_ECR_REPOSITORY: ${{ vars.AGENT_ECR_REPOSITORY }}
          FALCO_GATEWAY_ECR_REPOSITORY: ${{ vars.FALCO_GATEWAY_ECR_REPOSITORY }}
          NODE_IMAGE: ${{ vars.NODE_IMAGE }}
          RELEASE_REASON: ${{ inputs.releaseReason }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${GITHUB_REPOSITORY}" == "ydsveluvolu2996/Sutra" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${GITHUB_REF_PROTECTED}" == "true" ]]
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_REGION}" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          test -n "${AWS_ROLE_ARN}"
          [[ "${AGENT_ECR_REPOSITORY}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]
          [[ "${FALCO_GATEWAY_ECR_REPOSITORY}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]
          [[ "${AGENT_ECR_REPOSITORY}" != "${FALCO_GATEWAY_ECR_REPOSITORY}" ]]
          [[ "${NODE_IMAGE}" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "${NODE_IMAGE}" == "gcr.io/distroless/nodejs22-debian13:nonroot@sha256:a2723a2817c5b01b8e7b98d567bc8b5a6b0e713e25bfb0a82b6ade4b9db06f50" ]]
          [[ "${AWS_ROLE_ARN}" =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
          [[ "${#RELEASE_REASON}" -ge 10 && "${#RELEASE_REASON}" -le 240 ]]
          [[ "${RELEASE_REASON}" != *$'\n'* && "${RELEASE_REASON}" != *$'\r'* ]]

      - name: Configure short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: sutra-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Verify account and immutable repository boundary
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AGENT_ECR_REPOSITORY: ${{ vars.AGENT_ECR_REPOSITORY }}
          FALCO_GATEWAY_ECR_REPOSITORY: ${{ vars.FALCO_GATEWAY_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "${account}" == "${AWS_ACCOUNT_ID}" ]]
          for repository in "${AGENT_ECR_REPOSITORY}" "${FALCO_GATEWAY_ECR_REPOSITORY}"; do
            read -r repository_uri tag_mutability scan_on_push encryption_type < <(
              aws ecr describe-repositories \
                --region "${AWS_REGION}" \
                --repository-names "${repository}" \
                --query 'repositories[0].[repositoryUri,imageTagMutability,imageScanningConfiguration.scanOnPush,encryptionConfiguration.encryptionType]' \
                --output text
            )
            [[ "${repository_uri}" == "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${repository}" ]]
            [[ "${tag_mutability}" == "IMMUTABLE" ]]
            [[ "${scan_on_push}" == "True" ]]
            [[ "${encryption_type}" == "AES256" ]]
          done

      - name: Install Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Authenticate Docker to the approved ECR registry
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "${AWS_REGION}" |
            docker login --username AWS --password-stdin "${registry}"

      - name: Build and push immutable agent image
        id: agent-image
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AGENT_ECR_REPOSITORY: ${{ vars.AGENT_ECR_REPOSITORY }}
          NODE_IMAGE: ${{ vars.NODE_IMAGE }}
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          tag="git-${GITHUB_SHA}"
          image="${registry}/${AGENT_ECR_REPOSITORY}:${tag}"
          docker buildx build \
            --file services/kubernetes-collector/Dockerfile.agent \
            --platform linux/amd64 \
            --build-arg "NODE_IMAGE=${NODE_IMAGE}" \
            --provenance=true \
            --sbom=true \
            --push \
            --tag "${image}" \
            .
          digest="$(aws ecr describe-images \
            --repository-name "${AGENT_ECR_REPOSITORY}" \
            --image-ids "imageTag=${tag}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=${registry}/${AGENT_ECR_REPOSITORY}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Build and push immutable Falco gateway image
        id: falco-gateway-image
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          FALCO_GATEWAY_ECR_REPOSITORY: ${{ vars.FALCO_GATEWAY_ECR_REPOSITORY }}
          NODE_IMAGE: ${{ vars.NODE_IMAGE }}
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          tag="git-${GITHUB_SHA}"
          image="${registry}/${FALCO_GATEWAY_ECR_REPOSITORY}:${tag}"
          docker buildx build \
            --file services/falco-signing-gateway/Dockerfile \
            --platform linux/amd64 \
            --build-arg "NODE_IMAGE=${NODE_IMAGE}" \
            --provenance=true \
            --sbom=true \
            --push \
            --tag "${image}" \
            .
          digest="$(aws ecr describe-images \
            --repository-name "${FALCO_GATEWAY_ECR_REPOSITORY}" \
            --image-ids "imageTag=${tag}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=${registry}/${FALCO_GATEWAY_ECR_REPOSITORY}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Scan the agent image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.agent-image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Scan the Falco gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.falco-gateway-image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate separate image SBOMs
        run: |
          set -euo pipefail
          syft "${{ steps.agent-image.outputs.ref }}" \
            --output "spdx-json=sutra-kubernetes-agent.spdx.json"
          syft "${{ steps.falco-gateway-image.outputs.ref }}" \
            --output "spdx-json=sutra-falco-signing-gateway.spdx.json"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign agent digest and attach SBOM attestation
        env:
          IMAGE_REF: ${{ steps.agent-image.outputs.ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_REF}"
          cosign attest --yes \
            --type spdxjson \
            --predicate sutra-kubernetes-agent.spdx.json \
            "${IMAGE_REF}"

      - name: Keyless-sign Falco gateway digest and attach SBOM attestation
        env:
          IMAGE_REF: ${{ steps.falco-gateway-image.outputs.ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_REF}"
          cosign attest --yes \
            --type spdxjson \
            --predicate sutra-falco-signing-gateway.spdx.json \
            "${IMAGE_REF}"

      - name: Create immutable release manifest
        env:
          AGENT_IMAGE_REF: ${{ steps.agent-image.outputs.ref }}
          FALCO_GATEWAY_IMAGE_REF: ${{ steps.falco-gateway-image.outputs.ref }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const release = {
            schemaVersion: "sutra.kubernetes-runtime-release.v1",
            commitSha: process.env.GITHUB_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            workflowRef: process.env.GITHUB_WORKFLOW_REF,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            images: {
              agent: process.env.AGENT_IMAGE_REF,
              falcoSigningGateway: process.env.FALCO_GATEWAY_IMAGE_REF,
            },
          };
          writeFileSync(
            "sutra-kubernetes-runtime-release.json",
            `${JSON.stringify(release, null, 2)}\n`,
            { encoding: "utf8", mode: 0o600 },
          );
          NODE

      - name: Retain reviewed agent SBOM
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sutra-kubernetes-agent-${{ github.sha }}-sbom
          path: sutra-kubernetes-agent.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain reviewed Falco gateway SBOM
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sutra-falco-signing-gateway-${{ github.sha }}-sbom
          path: sutra-falco-signing-gateway.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain reviewed runtime release manifest
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sutra-kubernetes-runtime-${{ github.sha }}-release
          path: sutra-kubernetes-runtime-release.json
          if-no-files-found: error
          retention-days: 90
