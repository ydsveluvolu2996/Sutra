name: Release Sutra live application to EC2

on:
  workflow_dispatch:
    inputs:
      releaseReason:
        description: Approved reason for this live EC2 release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sutra-ec2-live-release
  cancel-in-progress: false

env:
  APP_ECR_REPOSITORY: sutra/app
  PUBLIC_ORIGIN: https://www.sutracmdb.com
  RELEASE_DOCUMENT_NAME: Sutra-DeployImmutableRelease
  RELEASE_SHA: ${{ github.sha }}
  RELEASE_REASON: ${{ inputs.releaseReason }}

jobs:
  release:
    name: Build, scan, deploy, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ec2-live-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Validate release configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "ydsveluvolu2996/Sutra" ]]
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RELEASE_SHA}" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]]
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_REGION}" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          [[ "${AWS_ROLE_ARN}" =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
          [[ "${EC2_INSTANCE_ID}" =~ ^i-[0-9a-f]{17}$ ]]
          [[ "${APP_ECR_REPOSITORY}" == "sutra/app" ]]
          [[ "${PUBLIC_ORIGIN}" == "https://www.sutracmdb.com" ]]
          [[ "${RELEASE_DOCUMENT_NAME}" == "Sutra-DeployImmutableRelease" ]]
          [[ "${#RELEASE_REASON}" -ge 10 && "${#RELEASE_REASON}" -le 100 ]]
          [[ "${RELEASE_REASON}" != *$'\n'* && "${RELEASE_REASON}" != *$'\r'* ]]

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.0
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run bounded source and release gates
        run: |
          set -euo pipefail
          pnpm security:secrets
          pnpm typecheck
          pnpm typecheck:collector
          pnpm lint
          pnpm test:templates
          node --test \
            tests/release-volume-capabilities.test.mjs \
            tests/github-workflow-security.test.mjs \
            tests/backup-contract.test.mjs \
            tests/deployment-security.test.ts \
            tests/docker-runtime-isolation.test.mjs
          bash deploy/ec2/validate-ops.sh

      # PUBLISH BEFORE YOU SHIP. The customer quick-create link the application
      # hands out embeds the reviewed template's hash in its S3 key
      # (templates/${VERSION}/${SHA256}.yaml), so shipping an application whose
      # pinned template was never published leaves every new customer's
      # onboarding link pointing at an object that does not exist. Automated
      # releases make that ordering easy to forget, so it is enforced here
      # rather than remembered: the published bytes must exist AND hash to the
      # exact reviewed digest before any image is built or deployed.
      - name: Require the reviewed onboarding template to be published
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          # Both of these are OVERRIDES, not requirements. The publisher
          # (scripts/publish-onboarding-template.mjs) derives its destination
          # deterministically as sutra-onboarding-<account>-<region>, defaulting
          # the region to us-east-1, so this gate derives the identical location
          # instead of depending on an operator remembering to mirror it into a
          # repository variable. Two releases were burned proving that point:
          # an unset variable reads as the empty string in `vars.*`, which is
          # indistinguishable here from a variable that was never created,
          # created as a secret, or created under a different name.
          TEMPLATE_BUCKET: ${{ vars.SUTRA_TEMPLATE_BUCKET }}
          # Where the template is PUBLISHED, which is independent of where this
          # release deploys. The quick-create template is a public read-only
          # artifact that customers fetch directly; it does not have to live in
          # the region hosting ECR and the EC2 instance. Defaulting this to the
          # deployment region -- as it previously did -- is wrong for the same
          # reason: the publisher's default is us-east-1, so the two sides
          # disagreed the moment the release targeted anywhere else.
          TEMPLATE_REGION: ${{ vars.SUTRA_TEMPLATE_REGION }}
        run: |
          set -euo pipefail
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          template_region="${TEMPLATE_REGION:-us-east-1}"
          [[ "${template_region}" =~ ^[a-z]{2}-[a-z0-9-]+-[0-9]+$ ]]
          template_bucket="${TEMPLATE_BUCKET:-sutra-onboarding-${AWS_ACCOUNT_ID}-${template_region}}"
          [[ "${template_bucket}" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          # The deterministic bucket name ends in the region it was created in,
          # so a mismatch is detectable here rather than as an opaque 404.
          if [[ "${template_bucket}" == sutra-onboarding-*-* \
                && "${template_bucket}" != *"-${template_region}" ]]; then
            echo "Template bucket ${template_bucket} does not end in the template region ${template_region}." >&2
            echo "Set SUTRA_TEMPLATE_REGION to the region the template was published in," >&2
            echo "or republish the template into ${template_region}." >&2
            exit 1
          fi
          echo "Template location: s3://${template_bucket} (${template_region})."
          contract="lib/aws-template-contract.ts"
          version="$(node -e "const s=require('fs').readFileSync('${contract}','utf8');const m=/AWS_CUSTOMER_ROLE_TEMPLATE_VERSION\s*=\s*\"([^\"]+)\"/.exec(s);if(!m)process.exit(1);process.stdout.write(m[1])")"
          digest="$(node -e "const s=require('fs').readFileSync('${contract}','utf8');const m=/AWS_CUSTOMER_ROLE_TEMPLATE_SHA256\s*=\s*\n?\s*\"([a-f0-9]{64})\"/.exec(s);if(!m)process.exit(1);process.stdout.write(m[1])")"
          [[ "${version}" =~ ^standard-[0-9]{4}-[0-9]{2}\.[0-9]+$ ]]
          [[ "${digest}" =~ ^[a-f0-9]{64}$ ]]
          # The published object is public and read-only by contract, so this
          # needs no credentials and runs before the OIDC role is assumed.
          url="https://${template_bucket}.s3.${template_region}.amazonaws.com/templates/${version}/${digest}.yaml"
          if ! curl -fsSL --max-time 30 --retry 2 --retry-delay 5 -o published-template.yaml "${url}"; then
            echo "The reviewed onboarding template ${version} is NOT published." >&2
            echo "Expected object: ${url}" >&2
            echo "Run 'pnpm live:aws:publish-template' from a credentialed machine, then re-run this release." >&2
            echo "Deploying now would leave every new customer quick-create link returning 404." >&2
            exit 1
          fi
          published_digest="$(sha256sum published-template.yaml | cut -d' ' -f1)"
          if [[ "${published_digest}" != "${digest}" ]]; then
            echo "The published object does not match the reviewed template bytes." >&2
            echo "Expected sha256 ${digest}, published object hashes to ${published_digest}." >&2
            exit 1
          fi
          # Prove the published bytes are also the bytes committed in this
          # release revision, so a stale publish of a different template that
          # happens to sit at this key cannot satisfy the gate.
          committed_digest="$(sha256sum public/sutra-customer-onboarding-role.yaml | cut -d' ' -f1)"
          [[ "${committed_digest}" == "${digest}" ]]
          rm -f published-template.yaml
          echo "Onboarding template ${version} is published and byte-exact (${digest})."

      # STS answers a subject mismatch with "Not authorized to perform
      # sts:AssumeRoleWithWebIdentity" and nothing else -- not the subject it
      # received, not the one it wanted. That single opaque line is what a
      # release costs when the trust policy and the token disagree, and the
      # disagreement is invisible until a run gets this far.
      #
      # This repository's tokens carry the repo component as
      # <owner>@<owner_id>/<repo>@<repo_id>, and the selector switches from
      # ref: to environment: purely because the job declares an environment.
      # Both are easy to get wrong from memory and impossible to read from the
      # AWS side, so the subject is printed and checked here instead.
      #
      # Only non-secret identity claims are ever printed. The token itself is
      # a credential: it is piped, never placed in argv, and never echoed.
      - name: Report the OIDC subject before assuming the release role
        env:
          EXPECTED_SUB: repo:ydsveluvolu2996@229068958/Sutra@1301833628:environment:ec2-live-release
        run: |
          set -euo pipefail
          token="$(curl -fsSL --max-time 30 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
            jq -r '.value')"
          [[ -n "${token}" && "${token}" != "null" ]]
          claims="$(printf '%s' "${token}" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const payload = raw.trim().split(".")[1];
              const claims = JSON.parse(Buffer.from(payload, "base64url").toString("utf8"));
              const identity = {
                sub: claims.sub,
                aud: claims.aud,
                repository: claims.repository,
                repository_id: claims.repository_id,
                repository_owner_id: claims.repository_owner_id,
                environment: claims.environment ?? null,
                ref: claims.ref ?? null,
              };
              process.stdout.write(JSON.stringify(identity));
            });
          ')"
          unset token
          echo "Presented identity: ${claims}"
          actual_sub="$(jq -r '.sub' <<< "${claims}")"
          if [[ "${actual_sub}" != "${EXPECTED_SUB}" ]]; then
            echo "The OIDC subject does not match the release role's trust policy." >&2
            echo "  token presents: ${actual_sub}" >&2
            echo "  policy expects: ${EXPECTED_SUB}" >&2
            echo "Update the sub condition in infrastructure/github-ec2-release-role.yaml" >&2
            echo "and the deployed stack to the presented value, then re-run." >&2
            exit 1
          fi
          [[ "$(jq -r '.aud' <<< "${claims}")" == "sts.amazonaws.com" ]]

      - name: Configure short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: sutra-ec2-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Verify account and immutable repository boundary
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "${account}" == "${AWS_ACCOUNT_ID}" ]]
          read -r repository_uri tag_mutability scan_on_push encryption_type < <(
            aws ecr describe-repositories \
              --region "${AWS_REGION}" \
              --repository-names "${APP_ECR_REPOSITORY}" \
              --query 'repositories[0].[repositoryUri,imageTagMutability,imageScanningConfiguration.scanOnPush,encryptionConfiguration.encryptionType]' \
              --output text
          )
          [[ "${repository_uri}" == "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${APP_ECR_REPOSITORY}" ]]
          [[ "${tag_mutability}" == "IMMUTABLE" ]]
          [[ "${scan_on_push}" == "True" || "${scan_on_push}" == "False" ]]
          [[ "${encryption_type}" == "AES256" || "${encryption_type}" == "KMS" ]]
          expected_lifecycle="$(jq -cS . deploy/ec2/ecr-lifecycle-policy.json)"
          actual_lifecycle_text="$(aws ecr get-lifecycle-policy \
            --region "${AWS_REGION}" \
            --repository-name "${APP_ECR_REPOSITORY}" \
            --query lifecyclePolicyText --output text)"
          actual_lifecycle="$(jq -cS . <<< "${actual_lifecycle_text}")"
          [[ "${actual_lifecycle}" == "${expected_lifecycle}" ]] || {
            echo "The live ECR lifecycle policy has drifted from the reviewed release contract." >&2
            exit 1
          }

      - name: Install Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Authenticate Docker to the approved ECR registry
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "${AWS_REGION}" |
            docker login --username AWS --password-stdin "${registry}"

      - name: Build and push an immutable scan candidate
        id: image
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          candidate_tag="candidate-${RELEASE_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_tag="sha-${RELEASE_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "${candidate_tag}" =~ ^candidate-[a-f0-9]{40}-run-[0-9]+-[0-9]+$ ]]
          [[ "${release_tag}" =~ ^sha-[a-f0-9]{40}-run-[0-9]+-[0-9]+$ ]]
          candidate_image="${registry}/${APP_ECR_REPOSITORY}:${candidate_tag}"
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --cache-from type=gha,scope=sutra-app \
            --cache-to type=gha,mode=max,scope=sutra-app \
            --push \
            --tag "${candidate_image}" \
            .
          digest="$(aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${APP_ECR_REPOSITORY}" \
            --image-ids "imageTag=${candidate_tag}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          image_ref="${registry}/${APP_ECR_REPOSITORY}@${digest}"
          [[ "${image_ref}" =~ ^${AWS_ACCOUNT_ID}\.dkr\.ecr\.${AWS_REGION}\.amazonaws\.com/sutra/app@sha256:[a-f0-9]{64}$ ]]
          echo "candidate_tag=${candidate_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Scan the exact application digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Promote the scanned digest to a retained release tag
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          CANDIDATE_TAG: ${{ steps.image.outputs.candidate_tag }}
          RELEASE_TAG: ${{ steps.image.outputs.release_tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_TAG}" =~ ^candidate-[a-f0-9]{40}-run-[0-9]+-[0-9]+$ ]]
          [[ "${RELEASE_TAG}" =~ ^sha-[a-f0-9]{40}-run-[0-9]+-[0-9]+$ ]]
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]

          candidate="$(aws ecr batch-get-image \
            --region "${AWS_REGION}" \
            --repository-name "${APP_ECR_REPOSITORY}" \
            --image-ids "imageTag=${CANDIDATE_TAG}" \
            --output json)"
          jq -e '(.images | length) == 1 and ((.failures // []) | length) == 0' \
            <<< "${candidate}" >/dev/null
          source_digest="$(jq -r '.images[0].imageId.imageDigest' <<< "${candidate}")"
          source_tag="$(jq -r '.images[0].imageId.imageTag' <<< "${candidate}")"
          media_type="$(jq -r '.images[0].imageManifestMediaType' <<< "${candidate}")"
          manifest="$(jq -r '.images[0].imageManifest' <<< "${candidate}")"
          [[ "${source_digest}" == "${DIGEST}" ]]
          [[ "${source_tag}" == "${CANDIDATE_TAG}" ]]
          [[ "${media_type}" == "application/vnd.oci.image.index.v1+json" ]]
          printf '%s' "${manifest}" | jq -e '
            .schemaVersion == 2
            and .mediaType == "application/vnd.oci.image.index.v1+json"
            and any(.manifests[];
              .platform.os == "linux" and .platform.architecture == "amd64")
            and any(.manifests[];
              .annotations["vnd.docker.reference.type"] == "attestation-manifest")
          ' >/dev/null
          manifest_digest="sha256:$(printf '%s' "${manifest}" | sha256sum | awk '{print $1}')"
          [[ "${manifest_digest}" == "${DIGEST}" ]]

          promoted_digest="$(aws ecr put-image \
            --region "${AWS_REGION}" \
            --repository-name "${APP_ECR_REPOSITORY}" \
            --image-manifest "${manifest}" \
            --image-manifest-media-type "${media_type}" \
            --image-tag "${RELEASE_TAG}" \
            --image-digest "${DIGEST}" \
            --query 'image.imageId.imageDigest' \
            --output text)"
          [[ "${promoted_digest}" == "${DIGEST}" ]]
          retained_digest="$(aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${APP_ECR_REPOSITORY}" \
            --image-ids "imageTag=${RELEASE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "${retained_digest}" == "${DIGEST}" ]]

      - name: Require the manually started host to be online in SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          connection_status="notconnected"
          for _ in $(seq 1 6); do
            connection_status="$(aws ssm get-connection-status \
              --region "${AWS_REGION}" \
              --target "${EC2_INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || printf 'notconnected')"
            [[ "${connection_status}" == "connected" ]] && break
            sleep 5
          done
          [[ "${connection_status}" == "connected" ]] || {
            echo "Start Sutra manually and wait for the exact EC2 host to become an online SSM managed node, then retry this release." >&2
            exit 1
          }

      - name: Deploy the exact digest through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_REF}" =~ ^[0-9]{12}\.dkr\.ecr\.${AWS_REGION}\.amazonaws\.com/sutra/app@sha256:[a-f0-9]{64}$ ]]
          [[ "${RELEASE_DOCUMENT_NAME}" == "Sutra-DeployImmutableRelease" ]]
          parameters="$(jq -cn --arg image_ref "${IMAGE_REF}" '{ImageRef:[$image_ref]}')"
          command_id="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "${RELEASE_DOCUMENT_NAME}" \
            --comment "${RELEASE_REASON}" \
            --timeout-seconds 60 \
            --parameters "${parameters}" \
            --query 'Command.CommandId' \
            --output text)"
          [[ "${command_id}" =~ ^[0-9a-f-]{36}$ ]]

          status="Pending"
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || printf 'Pending')"
            case "${status}" in
              Success) break ;;
              Cancelled|TimedOut|Failed|Cancelling)
                invocation_details="$(aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${command_id}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query '{status:StatusDetails,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json 2>/dev/null || printf '{"status":"Unavailable","stdout":"","stderr":""}')"
                jq -r '"SSM release failed: \(.status)\n--- host stdout ---\n\(.stdout)\n--- host stderr ---\n\(.stderr)"' \
                  <<<"${invocation_details}" >&2
                exit 1
                ;;
              Pending|InProgress|Delayed) sleep 5 ;;
              *) echo "Unexpected SSM command status: ${status}" >&2; exit 1 ;;
            esac
          done
          [[ "${status}" == "Success" ]] || {
            echo "SSM release did not complete within 15 minutes." >&2
            exit 1
          }
          response_code="$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query ResponseCode --output text)"
          [[ "${response_code}" == "0" ]]

      - name: Verify the public application and status endpoints
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          RELEASE_TAG: ${{ steps.image.outputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^sha-[a-f0-9]{40}-run-[0-9]+-[0-9]+$ ]]
          [[ "${IMAGE_REF}" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/sutra/app@sha256:[a-f0-9]{64}$ ]]
          verify_root="$(mktemp -d)"
          trap 'rm -rf "${verify_root}"' EXIT
          response_headers=""
          response_body=""
          response_code="000"

          fetch_200() {
            local path="$1" label="$2" attempts="$3" attempt
            response_headers="${verify_root}/${label}.headers"
            response_body="${verify_root}/${label}.body"
            response_code="000"
            for ((attempt = 1; attempt <= attempts; attempt += 1)); do
              if response_code="$(curl --silent --show-error \
                --connect-timeout 10 --max-time 15 \
                --dump-header "${response_headers}" --output "${response_body}" \
                --write-out '%{http_code}' "${PUBLIC_ORIGIN}${path}")" \
                && [[ "${response_code}" == 200 ]]; then
                return 0
              fi
              (( attempt == attempts )) || sleep 5
            done
            echo "${PUBLIC_ORIGIN}${path} returned HTTP ${response_code}; expected 200." >&2
            return 1
          }

          fetch_200 "/api/healthz" "health" 12
          served_image="$(tr -d '\r' < "${response_headers}" | awk '
            tolower($1) == "x-sutra-release-image:" {
              $1 = ""; sub(/^[[:space:]]+/, ""); print
            }
          ' | tail -n1)"
          [[ "${served_image}" == "${IMAGE_REF}" ]] || {
            echo "Public health served ${served_image:-no release identity}; expected ${IMAGE_REF}." >&2
            exit 1
          }

          for path in /api/status /login; do
            label="$(tr -cd 'a-z0-9' <<< "${path}")"
            fetch_200 "${path}" "${label}" 3
          done

          for path in / /about /contact /security /privacy /terms /status /robots.txt /sitemap.xml; do
            label="indexable-$(tr -cd 'a-z0-9' <<< "${path}")"
            [[ "${path}" == / ]] && label="indexable-home"
            fetch_200 "${path}" "${label}" 3
            if tr -d '\r' < "${response_headers}" | grep -Eiq '^x-robots-tag:.*noindex'; then
              echo "${PUBLIC_ORIGIN}${path} is unexpectedly noindex." >&2
              exit 1
            fi
            if [[ "${path}" == "/robots.txt" ]]; then
              grep -Fqx "Sitemap: ${PUBLIC_ORIGIN}/sitemap.xml" "${response_body}"
            elif [[ "${path}" == "/sitemap.xml" ]]; then
              grep -Fq "<loc>${PUBLIC_ORIGIN}/</loc>" "${response_body}"
            fi
          done

          apex_headers="${verify_root}/apex.headers"
          apex_code="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 15 \
            --dump-header "${apex_headers}" --output /dev/null \
            --write-out '%{http_code}' "https://sutracmdb.com/")"
          apex_location="$(tr -d '\r' < "${apex_headers}" | awk '
            tolower($1) == "location:" {
              $1 = ""; sub(/^[[:space:]]+/, ""); print
            }
          ' | tail -n1)"
          [[ "${apex_code}" == 308 && "${apex_location}" == "${PUBLIC_ORIGIN}/" ]]
          {
            echo "### Sutra EC2 release verified"
            echo
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Retained release tag: \`${RELEASE_TAG}\`"
            echo "- Public origin: ${PUBLIC_ORIGIN}"
            echo "- SSM deployment and all public health checks passed."
          } >> "${GITHUB_STEP_SUMMARY}"
