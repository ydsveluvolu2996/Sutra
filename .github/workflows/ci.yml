name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-pr-gate:
    name: Resolve exact PR verification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Require a successful CI run for the exact merged PR head
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "reuse=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "reason=full gate required for $EVENT_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! pull_requests="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls")"; then
            echo "reason=GitHub PR lookup unavailable; full gate required" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matching_prs="$(jq -c \
            --arg repository "$REPOSITORY" \
            --arg commit_sha "$COMMIT_SHA" \
            '[.[] | select(
              .merged_at != null
              and .merge_commit_sha == $commit_sha
              and .base.ref == "main"
              and .base.repo.full_name == $repository
            )]' <<< "$pull_requests")"

          if [[ "$(jq 'length' <<< "$matching_prs")" != "1" ]]; then
            echo "reason=direct or ambiguous main push; full gate required" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_number="$(jq -r '.[0].number' <<< "$matching_prs")"
          head_sha="$(jq -r '.[0].head.sha' <<< "$matching_prs")"
          head_branch="$(jq -r '.[0].head.ref' <<< "$matching_prs")"
          head_repository="$(jq -r '.[0].head.repo.full_name' <<< "$matching_prs")"
          pr_title="$(jq -r '.[0].title' <<< "$matching_prs")"
          pr_created_at="$(jq -r '.[0].created_at' <<< "$matching_prs")"
          merged_at="$(jq -r '.[0].merged_at' <<< "$matching_prs")"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ -n "$head_branch" && "$head_branch" != "null" ]]
          [[ "$head_repository" == "$REPOSITORY" ]]
          [[ -n "$pr_title" && "$pr_title" != "null" ]]
          [[ "$pr_created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
          [[ "$merged_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]

          if ! workflow_runs="$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?event=pull_request&head_sha=${head_sha}&status=completed&per_page=100")"; then
            echo "reason=GitHub Actions lookup unavailable; full gate required" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          verified_count="$(jq -s \
            --arg head_sha "$head_sha" \
            --arg head_branch "$head_branch" \
            --arg head_repository "$head_repository" \
            --arg pr_title "$pr_title" \
            --arg pr_created_at "$pr_created_at" \
            --arg merged_at "$merged_at" \
            '[.[].workflow_runs[] | select(
              .head_sha == $head_sha
              and .head_branch == $head_branch
              and .head_repository.full_name == $head_repository
              and .display_title == $pr_title
              and .conclusion == "success"
              and .created_at >= $pr_created_at
              and .updated_at <= $merged_at
            )] | length' <<< "$workflow_runs")"

          if [[ "$verified_count" -lt 1 ]]; then
            echo "reason=merged PR head has no successful exact CI run; full gate required" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "reuse=true" >> "$GITHUB_OUTPUT"
          echo "reason=exact PR head already passed CI before merge" >> "$GITHUB_OUTPUT"

  quality:
    name: Application quality, tests, and build
    needs: reuse-pr-gate
    if: ${{ needs.reuse-pr-gate.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.0
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject committed credentials and local state
        run: node scripts/check-repository-secrets.mjs

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Gate fixable dependency vulnerabilities
        run: trivy fs --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

      - name: Gate Kubernetes and infrastructure misconfigurations
        run: trivy config --quiet --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore.yaml .

      - name: Run the combined repository security gate
        run: node scripts/pipeline-scan.mjs --fail-on high

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck AWS collector
        run: pnpm typecheck:collector

      - name: Lint
        run: pnpm lint

      - name: Run every offline PR-gate test serially
        run: node scripts/ci-test-shard.mjs

      - name: Build
        run: pnpm build

      - name: Test rendered routes
        run: pnpm test:rendered

  integration:
    name: Collector, CloudFormation, and PostgreSQL
    needs: reuse-pr-gate
    if: ${{ needs.reuse-pr-gate.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.0
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test AWS collector
        run: pnpm test:collector

      - name: Install pinned CloudFormation linter
        run: python -m pip install --disable-pip-version-check cfn-lint==1.46.0

      - name: Validate CloudFormation templates
        run: cfn-lint infrastructure/local-collector-role.yaml infrastructure/customer-onboarding-role.yaml infrastructure/hosted-identity.yaml infrastructure/github-ec2-release-role.yaml public/sutra-customer-onboarding-role.yaml

      - name: Test PostgreSQL adapter and repositories
        run: pnpm db:postgres:test

  release-gate:
    # Preserve the existing required-check name. An exact squash/merge commit
    # may reuse only a successful CI run for that PR's immutable head SHA.
    # Direct pushes, failed PRs, ambiguous API responses and API outages all
    # fail closed into a complete rerun.
    name: Typecheck, lint, test, and build
    if: ${{ always() }}
    needs: [reuse-pr-gate, quality, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a successful full or exact reused gate
        env:
          PROVENANCE_RESULT: ${{ needs.reuse-pr-gate.result }}
          REUSE: ${{ needs.reuse-pr-gate.outputs.reuse }}
          REUSE_REASON: ${{ needs.reuse-pr-gate.outputs.reason }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail
          test "$PROVENANCE_RESULT" = success
          if [[ "$REUSE" == "true" ]]; then
            test "$QUALITY_RESULT" = skipped
            test "$INTEGRATION_RESULT" = skipped
            echo "Reused prior verification: $REUSE_REASON"
          else
            test "$QUALITY_RESULT" = success
            test "$INTEGRATION_RESULT" = success
          fi
