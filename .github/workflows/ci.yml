name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject committed credentials and local state
        run: node scripts/check-repository-secrets.mjs

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck AWS collector
        run: pnpm typecheck:collector

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test AWS collector
        run: pnpm test:collector

      - name: Install pinned CloudFormation linter
        run: python -m pip install --disable-pip-version-check cfn-lint==1.53.0

      - name: Validate CloudFormation templates
        run: cfn-lint infrastructure/local-collector-role.yaml infrastructure/customer-role-live-demo.yaml public/sutra-customer-role-live-demo.yaml

      - name: Test PostgreSQL adapter and repositories
        run: pnpm db:postgres:test

      - name: Build
        run: pnpm build

      - name: Test rendered routes
        run: pnpm test:rendered
