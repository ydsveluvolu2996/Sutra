name: Pipeline security gate

# Combined CI/CD security gate: repository secret scan + dependency/filesystem
# vulnerability scan (Trivy) + IaC misconfiguration gate, aggregated into one
# pass/fail. Runs on every PR/push and is also reusable (workflow_call) so a
# consumer pipeline can gate a build before promotion.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      fail-on:
        description: "Minimum severity that fails the gate: critical | high | medium | low."
        type: string
        required: false
        default: "high"
  workflow_dispatch:
    inputs:
      fail-on:
        description: "Minimum severity that fails the gate."
        type: string
        required: false
        default: "high"

permissions:
  contents: read

concurrency:
  group: pipeline-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Secret + dependency + IaC scan gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Trivy is placed on PATH so the pipeline gate's image/fs stage can run.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          version: v0.60.0

      - name: Trivy filesystem (dependency) scan
        run: trivy fs --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

      - name: Combined pipeline security gate (secret + IaC)
        run: node scripts/pipeline-scan.mjs --fail-on "${{ inputs.fail-on || 'high' }}"
