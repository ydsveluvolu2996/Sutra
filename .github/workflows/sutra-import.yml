name: Import verified Sutra source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ hashFiles('sutra-source.part-01') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand verified Sutra source snapshot
        run: |
          base64 --decode sutra-source.part-01 > /tmp/sutra-source.tar.gz
          tar -xzf /tmp/sutra-source.tar.gz
          rm sutra-source.part-01
          rm -f public/palisade-customer-role.yaml public/og.png

      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Rename product and source to Sutra"
          git push
