name: Bug report
description: Report a reproducible defect using synthetic or authorized data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, MFA codes, ExternalIds, customer data, account identifiers or raw provider payloads.
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: "Kubernetes collector, CMDB, auth, notifications"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic data or a disposable sandbox.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
